limit_req_zone $binary_remote_addr zone=cmdp_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cmdp_dynamicpages:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cmdp_cmdbuild:10m rate=30r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8088;
  server_name localhost 127.0.0.1;

  client_max_body_size 50m;

  location = /cmdbuild {
    return 308 /cmdbuild/;
  }

  location /cmdbuild/custom-api/labels/ {
    return 410;
  }

  location /cmdbuild/labels/ {
    return 410;
  }

  location /cmdbuild/custom-api/ {
    limit_req zone=cmdp_api burst=30 nodelay;

    proxy_pass http://127.0.0.1:8093/cmdbuild/custom-api/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /cmdbuild/dynamicpages/ {
    limit_req zone=cmdp_dynamicpages burst=60 nodelay;

    proxy_pass http://127.0.0.1:8093/cmdbuild/dynamicpages/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /cmdbuild/ {
    limit_req zone=cmdp_cmdbuild burst=120 nodelay;

    proxy_pass http://127.0.0.1:8093/cmdbuild/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location /health/ {
    proxy_pass http://127.0.0.1:8093/health/;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

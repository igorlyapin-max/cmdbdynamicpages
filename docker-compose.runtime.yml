services:
  cmdbdynamicpages:
    image: ${CMDBDYNAMIC_IMAGE}
    container_name: cmdbdynamicpages-backend
    restart: unless-stopped
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PROXY_HOST: ${PROXY_HOST:-127.0.0.1}
      PROXY_PORT: ${PROXY_PORT:-8093}
      CMDP_PUBLIC_ORIGIN: ${CMDP_PUBLIC_ORIGIN}
      CMDBUILD_ORIGIN: ${CMDBUILD_ORIGIN}
      CMDBUILD_REQUEST_TIMEOUT_MS: ${CMDBUILD_REQUEST_TIMEOUT_MS:-10000}
      CMDP_DRAFT_PREVIEW_TIMEOUT_MS: ${CMDP_DRAFT_PREVIEW_TIMEOUT_MS:-60000}
      CMDBDYNAMIC_REDIS_URL: ${CMDBDYNAMIC_REDIS_URL}
      CMDBDYNAMIC_REDIS_TLS_CA_FILE: ${CMDBDYNAMIC_REDIS_TLS_CA_FILE:-}
      CMDBDYNAMIC_REDIS_PASSWORD_FILE: ${CMDBDYNAMIC_REDIS_PASSWORD_FILE:-/run/secrets/cmdbdynamicpages_redis_password}
      CMDBDYNAMIC_REDIS_REQUIRED: ${CMDBDYNAMIC_REDIS_REQUIRED:-true}
      CMDBDYNAMIC_HEALTH_REDIS_REQUIRED: ${CMDBDYNAMIC_HEALTH_REDIS_REQUIRED:-true}
      CMDBDYNAMIC_HEALTH_TIMEOUT_MS: ${CMDBDYNAMIC_HEALTH_TIMEOUT_MS:-2000}
      CMDBDYNAMIC_REDIS_KEY_PREFIX: ${CMDBDYNAMIC_REDIS_KEY_PREFIX:-cmdp}
      CMDBDYNAMIC_REDIS_TIMEOUT_MS: ${CMDBDYNAMIC_REDIS_TIMEOUT_MS:-500}
      CMDBDYNAMICPAGES_CSRF_SECRET: ${CMDBDYNAMICPAGES_CSRF_SECRET}
      CMDP_PROXY_ALLOWLIST_STRICT: ${CMDP_PROXY_ALLOWLIST_STRICT:-true}
      CMDP_EXECUTION_MAX_SELECTION_SCAN_ROWS_ABSOLUTE: ${CMDP_EXECUTION_MAX_SELECTION_SCAN_ROWS_ABSOLUTE:-50000}
      CMDP_D2_RENDER_ENABLED: ${CMDP_D2_RENDER_ENABLED:-true}
      CMDP_D2_BINARY: ${CMDP_D2_BINARY:-/usr/local/bin/d2}
      CMDP_D2_TIMEOUT_MS: ${CMDP_D2_TIMEOUT_MS:-3000}
      CMDP_D2_MAX_INPUT_BYTES: ${CMDP_D2_MAX_INPUT_BYTES:-2097152}
      CMDP_D2_MAX_OUTPUT_BYTES: ${CMDP_D2_MAX_OUTPUT_BYTES:-10485760}
      CMDP_D2_MAX_DIAGRAMS: ${CMDP_D2_MAX_DIAGRAMS:-8}
      CMDP_D2_CONCURRENCY: ${CMDP_D2_CONCURRENCY:-2}
      CMDP_D2_LAYOUT: ${CMDP_D2_LAYOUT:-dagre}
      CMDP_D2_LAYOUT_ALLOWLIST: ${CMDP_D2_LAYOUT_ALLOWLIST:-dagre,elk}
      CMDP_D2_IMPORT_BINARY: ${CMDP_D2_IMPORT_BINARY:-/usr/local/bin/cmdp-d2-import}
      CMDP_D2_IMPORT_TIMEOUT_MS: ${CMDP_D2_IMPORT_TIMEOUT_MS:-5000}
      CMDP_D2_IMPORT_MAX_INPUT_BYTES: ${CMDP_D2_IMPORT_MAX_INPUT_BYTES:-1048576}
      CMDP_D2_IMPORT_MAX_OUTPUT_BYTES: ${CMDP_D2_IMPORT_MAX_OUTPUT_BYTES:-4194304}
      CMDP_D2_IMPORT_MAX_ELEMENTS: ${CMDP_D2_IMPORT_MAX_ELEMENTS:-5000}
      CMDP_D2_IMPORT_PROPOSAL_TTL_MS: ${CMDP_D2_IMPORT_PROPOSAL_TTL_MS:-1800000}
      CMDP_D2_IMPORT_ASSISTANT_MAX_SPEC_BYTES: ${CMDP_D2_IMPORT_ASSISTANT_MAX_SPEC_BYTES:-262144}
      CMDP_D2_IMPORT_ASSISTANT_CHECKPOINT_MAX_BYTES: ${CMDP_D2_IMPORT_ASSISTANT_CHECKPOINT_MAX_BYTES:-1048576}
      CMDP_TEMPLATE_REQUEST_MAX_BYTES: ${CMDP_TEMPLATE_REQUEST_MAX_BYTES:-5767168}
      CMDBDYNAMIC_EXECUTION_THROTTLE_ENABLED: ${CMDBDYNAMIC_EXECUTION_THROTTLE_ENABLED:-true}
      CMDBDYNAMIC_EXECUTION_THROTTLE_MAX_PER_SCOPE: ${CMDBDYNAMIC_EXECUTION_THROTTLE_MAX_PER_SCOPE:-2}
      CMDBDYNAMIC_EXECUTION_THROTTLE_MAX_GLOBAL: ${CMDBDYNAMIC_EXECUTION_THROTTLE_MAX_GLOBAL:-20}
      CMDBDYNAMIC_EXECUTION_THROTTLE_RETRY_AFTER_SEC: ${CMDBDYNAMIC_EXECUTION_THROTTLE_RETRY_AFTER_SEC:-5}
      CMDP_LOG_LEVEL: ${CMDP_LOG_LEVEL:-info}
      CMDP_LOG_FORMAT: ${CMDP_LOG_FORMAT:-json}
      CMDP_LOG_TARGET: ${CMDP_LOG_TARGET:-stdout,syslog}
      CMDP_DIAGNOSTIC_MODE: ${CMDP_DIAGNOSTIC_MODE:-off}
      CMDP_LOG_REDACT_HEADERS: ${CMDP_LOG_REDACT_HEADERS:-cookie,authorization,cmdbuild-authorization,x-csrf-token,x-cmdbdynamicpages-csrf,set-cookie}
      CMDP_LOG_REDACT_QUERY: ${CMDP_LOG_REDACT_QUERY:-password,passwd,pwd,token,secret,authorization,auth,csrf,x-cmdbdynamicpages-csrf}
      CMDP_ASSISTANT_ENABLED: ${CMDP_ASSISTANT_ENABLED:-false}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://127.0.0.1:4000/v1}
      CMDP_LITELLM_ALLOWED_BASE_URLS: ${CMDP_LITELLM_ALLOWED_BASE_URLS:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-corp-openai-gpt-4.1-mini}
      CMDP_ASSISTANT_LLM_MAX_REQUEST_BYTES_ABSOLUTE: ${CMDP_ASSISTANT_LLM_MAX_REQUEST_BYTES_ABSOLUTE:-2097152}
      CMDP_ASSISTANT_LLM_MAX_RESPONSE_BYTES_ABSOLUTE: ${CMDP_ASSISTANT_LLM_MAX_RESPONSE_BYTES_ABSOLUTE:-4194304}
      LITELLM_API_KEY_FILE: ${LITELLM_API_KEY_FILE:-/run/secrets/cmdbdynamicpages_litellm_api_key}
      CMDP_SYSLOG_HOST: ${CMDP_SYSLOG_HOST:?CMDP_SYSLOG_HOST must be set}
      CMDP_SYSLOG_PORT: ${CMDP_SYSLOG_PORT:-514}
      CMDP_SYSLOG_PROTOCOL: ${CMDP_SYSLOG_PROTOCOL:-udp}
      CMDP_SYSLOG_FACILITY: ${CMDP_SYSLOG_FACILITY:-local0}
    volumes:
      - type: bind
        source: ${CMDBDYNAMIC_REDIS_PASSWORD_FILE_HOST:-./secrets/cmdbdynamicpages_redis_password}
        target: /run/secrets/cmdbdynamicpages_redis_password
        read_only: true
      - type: bind
        source: ${LITELLM_API_KEY_FILE_HOST:-/dev/null}
        target: /run/secrets/cmdbdynamicpages_litellm_api_key
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${PROXY_PORT:-8093}/health/live || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

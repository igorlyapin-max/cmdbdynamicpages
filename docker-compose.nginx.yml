services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cmdbdynamicpages-nginx
    restart: unless-stopped
    network_mode: host
    environment:
      CMDP_NGINX_CUSTOM_API_READ_TIMEOUT: "${CMDP_NGINX_CUSTOM_API_READ_TIMEOUT:-70s}"
    volumes:
      - ./nginx/cmdbdynamicpages-dev.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8088/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cmdbdynamicpages-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no", "--dir", "/data"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
    name: cmdbdynamicpages-redis-data

name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run CI gate
        run: npm run ci

      - name: Upload CMDBuild custom page
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmdbdynamicpages-custompage
          path: dist/cmdbdynamicpages-custompage.zip
          if-no-files-found: error

      - name: Install required browser fixture
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Run required browser UI smoke
        run: npm run test:ui:required

  go_vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'

      - name: Test D2 importer
        run: go test ./cmd/cmdp-d2-import

      - name: Check D2 importer dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/cmdp-d2-import

  container:
    needs:
      - test
      - go_vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Validate container delivery files
        run: |
          npm run container:check
          docker compose --env-file .env.example -f docker-compose.runtime.yml config >/dev/null

      - name: Validate nginx templates
        run: bash scripts/nginx-test.sh

      - name: Build Docker image
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          raw_tag="${GITHUB_REF_NAME:-${GITHUB_SHA}}"
          tag="$(echo "$raw_tag" | tr '[:upper:]' '[:lower:]' | tr '/:@' '---' | tr -cd 'a-z0-9_.-')"
          if [ -z "$tag" ]; then tag="$GITHUB_SHA"; fi
          app_version="00.00.00.00"
          if [ -f VERSION ]; then app_version="$(tr -d '\r\n' < VERSION)"; fi
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$app_version"; fi
          manual_image="$image:manual-$tag"
          docker build -t "$manual_image" .
          docker run --rm --entrypoint node "$manual_image" scripts/build-identity.mjs verify-runtime --root /app --expect-provenance unverified-local
          node scripts/container-image.mjs build --tag "$image:$tag" --require-clean
          node scripts/container-image.mjs verify --image "$image:$tag" --require-clean
          gkm_node_image="cmdbdynamicpages-gkm-node:$tag"
          gkm_go_image="cmdbdynamicpages-gkm-go:$tag"
          docker build -f tests/fixtures/gkm-node-base.Dockerfile -t "$gkm_node_image-fixture" .
          docker build -f tests/fixtures/gkm-go-base.Dockerfile -t "$gkm_go_image-fixture" .
          gkm_fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$gkm_fixture_dir"' EXIT
          mkdir -p "$gkm_fixture_dir/ca"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$gkm_fixture_dir/fixture-key.pem" \
            -out "$gkm_fixture_dir/ca/fixture-ca.crt" \
            -days 1 -subj '/CN=cmdbdynamicpages-ci-fixture'
          gkm_node_base="$(sed -n 's/^ARG GKM_NODE_BASE_IMAGE=//p' Dockerfile)"
          test -n "$gkm_node_base"
          docker run --rm "$gkm_node_base" cat /etc/apk/repositories > "$gkm_fixture_dir/apk-repositories"
          scripts/build-gkm-base-images.sh \
            --node-tag "$gkm_node_image" --go-tag "$gkm_go_image" \
            --ca-dir "$gkm_fixture_dir/ca" \
            --apk-repositories "$gkm_fixture_dir/apk-repositories"
          docker run --rm --entrypoint sh "$gkm_node_image" -ec 'test -s /etc/apk/repositories && test -f /usr/local/share/ca-certificates/fixture-ca.crt'
          docker run --rm --entrypoint sh "$gkm_go_image" -ec 'test -s /etc/apk/repositories && test -f /usr/local/share/ca-certificates/fixture-ca.crt'
          gkm_manual_image="$image:gkm-manual-$tag"
          docker build --target gkm-runtime --build-arg "GKM_NODE_BASE_IMAGE=$gkm_node_image" --build-arg "GKM_GO_BASE_IMAGE=$gkm_go_image" -t "$gkm_manual_image" .
          docker run --rm --entrypoint node "$gkm_manual_image" scripts/build-identity.mjs verify-runtime --root /app --expect-provenance unverified-local
          node scripts/container-image.mjs build --target gkm-runtime-canonical --node-base-image "$gkm_node_image" --go-base-image "$gkm_go_image" --tag "$image:gkm-$tag" --require-clean
          node scripts/container-image.mjs verify --image "$image:gkm-$tag" --require-clean
          echo "CMDBDYNAMIC_CI_IMAGE=$image:$tag" >> "$GITHUB_ENV"
          echo "CMDBDYNAMIC_GKM_CI_IMAGE=$image:gkm-$tag" >> "$GITHUB_ENV"

      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push "$CMDBDYNAMIC_CI_IMAGE"
          docker push "$CMDBDYNAMIC_GKM_CI_IMAGE"

<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020" role="img" aria-labelledby="title desc">
  <title id="title">cmdbdynamicpages: границы и каналы данных</title>
  <desc id="desc">Обзор информационной модели. HTTP обмен показан в обе стороны; внешний collector получает логи. Локальные процессы D2 не являются сетевыми сервисами.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#43566b"/></marker>
    <style>
      text{font:16px Arial,sans-serif;fill:#172b3a}
      .title{font-size:25px;font-weight:bold}.heading{font-size:20px;font-weight:bold}
      .note{font-size:14px;fill:#43566b}.box{fill:#fff;stroke:#64748b;stroke-width:2}
      .owned{fill:#edf7f1;stroke:#20724a;stroke-width:2}
      .flow{fill:none;stroke:#43566b;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .oneway{fill:none;stroke:#43566b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="1020" fill="#f8fafc"/>
  <text x="40" y="40" class="title">cmdbdynamicpages: обзор архитектуры</text>
  <text x="40" y="65" class="note">Зелёные блоки — компоненты проекта. Внешние системы не входят в поставку. Полный реестр — information-model.md.</text>
  <rect x="40" y="110" width="290" height="105" rx="5" class="box"/>
  <text x="60" y="143" class="heading">Браузер пользователя</text>
  <text x="60" y="173">Designer / runtime / launcher</text>
  <text x="60" y="196" class="note">Сессия CMDBuild, same-origin</text>
  <rect x="600" y="110" width="330" height="105" rx="5" class="owned"/>
  <text x="620" y="143" class="heading">Проектный proxy / ingress</text>
  <text x="620" y="173">Стенд HTTP 8088</text>
  <text x="620" y="196" class="note">Контур HTTPS 443: согласовать</text>
  <path d="M 330 160 L 600 160" class="flow"/>
  <text x="355" y="140">HTTP 8088 / HTTPS 443</text>
  <text x="355" y="190" class="note">UI IF5; API по реестру OAPI</text>
  <path d="M 760 215 L 760 340" class="flow"/>
  <text x="780" y="273">HTTP 8093</text>
  <text x="780" y="297" class="note">запрос / ответ</text>
  <rect x="600" y="340" width="330" height="200" rx="5" class="owned"/>
  <text x="620" y="375" class="heading">cmdbdynamicpages</text>
  <text x="620" y="407">Node.js backend / UI</text>
  <text x="620" y="437">Стенд 127.0.0.1:8093</text>
  <text x="620" y="467">Детерминированный Object Flow</text>
  <text x="620" y="497">Mapping, фильтры, подписи, связи</text>
  <text x="620" y="522" class="note">LLM только для предложений автора</text>
  <rect x="40" y="320" width="310" height="100" rx="5" class="owned"/>
  <text x="60" y="353" class="heading">cmdp-d2-import</text>
  <text x="60" y="383">D2 → IR, структура и диагностика</text>
  <text x="60" y="405" class="note">Внутри image, без сетевого порта</text>
  <path d="M 350 370 L 600 370" class="flow"/>
  <text x="380" y="349">IF1 stdin / stdout</text>
  <rect x="40" y="480" width="310" height="100" rx="5" class="owned"/>
  <text x="60" y="513" class="heading">D2 renderer</text>
  <text x="60" y="543">Данные D2 → SVG</text>
  <text x="60" y="565" class="note">Внутри image, без сетевого порта</text>
  <path d="M 350 530 L 495 530 L 495 495 L 600 495" class="flow"/>
  <text x="375" y="476">IF2 stdin / stdout</text>
  <rect x="1150" y="300" width="310" height="120" rx="5" class="box"/>
  <text x="1170" y="335" class="heading">CMDBuild</text>
  <text x="1170" y="365">REST v3: сессии, модель, данные</text>
  <text x="1170" y="389">HTTP 8090 стенд / HTTPS 443</text>
  <text x="1170" y="410" class="note">Контур: CMDBUILD_ORIGIN</text>
  <path d="M 930 375 L 1150 375" class="flow"/>
  <text x="962" y="329">OAPI100 и далее</text>
  <text x="957" y="350" class="note">HTTP 8090 / HTTPS 443</text>
  <rect x="1150" y="480" width="310" height="100" rx="5" class="box"/>
  <text x="1170" y="513" class="heading">Redis</text>
  <text x="1170" y="543">Кэш / static snapshots</text>
  <text x="1170" y="565" class="note">RESP / TLS, порт из URL</text>
  <path d="M 930 495 L 1030 495 L 1030 530 L 1150 530" class="flow"/>
  <text x="952" y="466">IF0 RESP 6379</text>
  <rect x="1150" y="680" width="310" height="115" rx="5" class="box"/>
  <text x="1170" y="714" class="heading">LiteLLM, опционально</text>
  <text x="1170" y="744">chat/completions</text>
  <text x="1170" y="771" class="note">HTTPS 443 / HTTP 4000</text>
  <path d="M 880 540 L 880 735 L 1150 735" class="flow"/>
  <text x="910" y="692">OAPI200, предложение JSON</text>
  <text x="910" y="714" class="note">HTTP 4000 / HTTPS 443</text>
  <rect x="40" y="730" width="480" height="130" rx="5" class="box"/>
  <text x="60" y="764" class="heading">Платформа эксплуатации</text>
  <text x="60" y="795">Health, metrics, доставка логов</text>
  <text x="60" y="823">Collector, адреса и cadence: согласовать</text>
  <text x="60" y="847" class="note">stdout обязателен; внешний маршрут выбирает платформа</text>
  <path d="M 600 460 L 555 460 L 555 760 L 520 760" class="flow"/>
  <text x="568" y="616" class="note">H0/H1/H2/M0</text>
  <text x="568" y="637" class="note">HTTP 8093</text>
  <path d="M 760 540 L 760 835 L 520 835" class="oneway"/>
  <text x="785" y="781" class="note">L2 stdout (без порта)</text>
  <text x="785" y="804" class="note">L3 syslog UDP/TCP 514</text>
  <text x="785" y="827" class="note">L4 collector: порт согласовать</text>
  <text x="40" y="930">IF3: конфигурация и секреты — env/read-only файлы, не сетевой вызов secret store.</text>
  <text x="40" y="958">IF4: image и custompage ZIP — артефакты доставки. Установка launcher выполняется администратором CMDBuild.</text>
  <text x="40" y="986" class="note">Порты стенда не назначают топологию Production. Маршруты H/M/L и HTTP-операции уточнены в картах и OpenAPI.</text>
</svg>

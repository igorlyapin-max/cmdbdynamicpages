          type: integer
          enum: [1]
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        spec:
          type: object
          additionalProperties: false
          description: Ограниченный набор несохранённых полей редактора, накладываемый на указанный сохранённый шаблон.
          properties:
            version:
              type: integer
            params:
              type: array
              items: {}
            steps:
              type: array
              items: {}
            visualModel:
              type: object
              additionalProperties: true
            visualModels:
              type: array
              items: {}
            result:
              type: object
              additionalProperties: false
              properties:
                tables:
                  type: array
                  items: {}
                emptyText:
                  type: string
                permissionDeniedText:
                  type: string
            authoring:
              type: object
              additionalProperties: true
    AssistantObjectFlowIntent:
      type: object
      additionalProperties: false
      required: [context, blocks]
      properties:
        context:
          type: string
        blocks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, description, resultKind, dependsOn]
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              resultKind:
                type: string
                enum: [auto, sourceCards, relationPairs]
              dependsOn:
                type: array
                items:
                  type: string
    AssistantObjectFlowPlanResponse:
      type: object
      additionalProperties: false
      required: [success, action]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [assistant-object-flow-plan]
        flow:
          $ref: "#/components/schemas/ObjectFlowProposal"
        code:
          type: string
        message:
          type: string
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposalError"
        diagnostics:
          type: object
          additionalProperties: true
    AssistantProposalError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
        message:
          type: string
    ObjectFlowApplyRequest:
      type: object
      additionalProperties: false
      required: [templateCode, baseSpecHash, currentSpec, flow]
      properties:
        root:
          type: string
        templateCode:
          type: string
        baseSpecHash:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        flow:
          $ref: "#/components/schemas/ObjectFlowProposal"
    ObjectFlowApplyResponse:
      type: object
      additionalProperties: false
      required: [success, action, spec, specHash]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [object-flow-apply]
        spec:
          type: object
          additionalProperties: true
        specHash:
          type: string
        executionSpecHash:
          type: string
          description: Hash executable-части возвращённого draft; authoring-only изменения его не меняют.
    ObjectFlowProposal:
      type: object
      additionalProperties: false
      required: [version, selections, operations]
      properties:
        version:
          type: integer
          enum: [1]
        selections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectFlowSelectionStage"
        operations:
          type: array
          description: Упорядоченные операции match и set. Каждый alias источника должен быть материализован выборкой либо предшествующей операцией.
          items:
            $ref: "#/components/schemas/ObjectFlowOperation"
        publishedAlias:
          type: string
          description: Необязательный материализованный alias, выбранный для публикуемой таблицы результата.
        blocks:
          type: array
          description: Проекция операций match для совместимости, возвращаемая сервером.
          items:
            $ref: "#/components/schemas/ObjectFlowMatchStage"
        setOperations:
          type: array
          description: Проекция операций set для совместимости, возвращаемая сервером.
          items:
            $ref: "#/components/schemas/ObjectFlowSetOperation"
    ObjectFlowSourceRef:
      type: object
      additionalProperties: false
      required: [id, kind, alias]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [selection, match, set]
        alias:
          type: string
        className:
          type: string
        columns:
          type: array
          items:
            type: string
    ObjectFlowSelectionStage:
      type: object
      additionalProperties: false
      required: [id, name, alias, className, limit, columns, rules]
      properties:
        id:
          type: string
        name:
          type: string
        alias:
          type: string
        className:
          type: string
          description: Класс из каталога CMDBuild с учётом прав доступа, выбранный автором либо предложением.
        from:
          type: string
          description: Необязательный alias предшествующей выборки либо match, используемый коррелированными фильтрами.
        limit:
          type: integer
          minimum: 1
        columns:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ObjectFlowSelectionRule"
    ObjectFlowSelectionRule:
      type: object
      additionalProperties: false
      required: [action, path, negate, op]
      properties:
        action:
          type: string
          enum: [include, exclude]
        path:
          type: string
        negate:
          type: boolean
        op:
          type: string
          enum: [exists, notExists, matches, notMatches, equals, notEquals, in, contains, startsWith, endsWith, isIpv4, isIpv4Network, ipv4InCidr, ipv4InRange, ipv4CidrOverlaps, ipv4CidrContains]
        regex:
          type: string
        value:
          type: string
        valueParam:
          type: string
        valueColumn:
          type: string
    ObjectFlowMatchStage:
      type: object
      additionalProperties: false
      required: [id, from, with, as, rules]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [match]
        from:
          type: string
          description: Alias выборки либо предшествующей промежуточной операции match.
        with:
          type: string
          description: Alias выборки, присоединяемой на этом этапе.
        as:
          type: string
          description: Стабильный alias результата; этот результат также является источником сопоставления Diagram.
        rightPrefix:
          type: string
        rules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectFlowMatchRule"
    ObjectFlowSetOperation:
      type: object
      additionalProperties: false
      required: [id, type, from, with, as, on, distinct, caseSensitive]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [union, difference, intersect]
        from:
          type: string
        with:
          type: string
        as:
          type: string
        on:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [left, right]
            properties:
              left:
                type: string
              right:
                type: string
        distinct:
          type: boolean
        caseSensitive:
          type: boolean
    ObjectFlowOperation:
      oneOf:
        - $ref: "#/components/schemas/ObjectFlowMatchStage"
        - $ref: "#/components/schemas/ObjectFlowSetOperation"
    ObjectFlowMatchRule:
      type: object
      additionalProperties: false
      required: [action, negate, operator, leftColumn, rightColumn]
      properties:
        action:
          type: string
          enum: [include, exclude]
        negate:
          type: boolean
        operator:
          type: string
          enum: [equals, notEquals, contains, regexMatch, ipv4InCidr, ipv4InRange, ipv4CidrOverlaps, ipv4CidrContains]
        leftColumn:
          type: string
        leftRegex:
          type: string
        rightColumn:
          type: string
        rightRegex:
          type: string
    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
    McpJsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
    RuntimePermissionDenied:
      type: object
      description: Возвращается, когда CMDBuild запрещает доступ к классу или атрибуту, фактически используемому при выполнении шаблона, ответом 401/403. Endpoint в этом случае не возвращает частичные данные других выборок.
      properties:
        success:
          type: boolean
          example: false
        action:
          type: string
          example: run
        permissionDenied:
          type: boolean
          example: true
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        message:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
        permissionDeniedText:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
    SchemaBootstrapRequest:
      type: object
      properties:
        root:
          type: string
          example: Cst_QueryTool
        description:
          type: string
          example: CMDB Dynamic Pages technical root
        parent:
          type: string
          description: Суперкласс CMDBuild, под которым создаётся корневой технический класс.
          example: Class
        confirm:
          type: boolean
          description: Подтверждение в UI, что первичное создание схемы может добавлять только отсутствующие классы и атрибуты, но не перемещать и не удалять существующие объекты.
    BuildIdentity:
      type: object
      required: [version, revision, dirty, provenance, editorSha256]
      properties:
        version:
          type: string
          pattern: '^(0\.0\.0\.0|[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2})$'
        revision:
          type: string
          pattern: '^(unknown|[0-9a-f]{40})$'
        dirty:
          type: boolean
          nullable: true
        provenance:
          type: string
          enum: [verified, unverified-local]
        editorSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    HealthBase:
      type: object
      required: [service, build, timestamp, startedAt, uptimeSec, pid]
      properties:
        service:
          type: string
          example: cmdbdynamicpages
        build:
          $ref: "#/components/schemas/BuildIdentity"
        timestamp:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        uptimeSec:
          type: integer
        pid:
          type: integer
    LiveHealth:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [status, live]
          properties:
            status:
              type: string
              example: live
            live:
              type: boolean
    RedisStatus:
      type: object
      properties:
        required:
          type: boolean
        ok:
          type: boolean
        status:
          type: string
        enabled:
          type: boolean
        backend:
          type: string
          enum: [redis, memory]
        available:
          type: boolean
        url:
          type: string
          description: URL Redis с замаскированными учётными данными.
        keyPrefix:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        error:
          type: string
    RedisHealth:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [status, redis]
          properties:
            status:
              type: string
            redis:
              $ref: "#/components/schemas/RedisStatus"
    ReadyHealth:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [status, ready, checks]
          properties:
            status:
              type: string
            ready:
              type: boolean
            checks:
              type: object
              required: [process, redis, cmdbuild, d2, d2Import]
              properties:
                process:
                  type: object
                  properties:
                    ok:
                      type: boolean
                    status:
                      type: string
                redis:
                  $ref: "#/components/schemas/RedisStatus"
                cmdbuild:
                  type: object
                  properties:
                    required:
                      type: boolean
                    ok:
                      type: boolean
                    status:
                      type: string
                    url:
                      type: string
                    latencyMs:
                      type: integer
                    statusCode:
                      type: integer
                    error:
                      type: string
                d2:
                  $ref: "#/components/schemas/D2RendererHealth"
                d2Import:
                  $ref: "#/components/schemas/D2ImporterHealth"
    HealthFailure:
      allOf:
        - $ref: "#/components/schemas/HealthBase"
        - type: object
          required: [status, ready, error]
          description: Исключение health handler; checks может отсутствовать
          properties:
            status: { type: string, enum: [not_ready] }
            ready: { type: boolean, enum: [false] }
            error: { type: string }
    D2RendererHealth:
      type: object
      required: [required, enabled, ok, status, binary]
      description: >
        Локальный вызов D2 binary с --version. Выключенный renderer возвращает
        required=false, enabled=false, ok=true, status=disabled без version,
        error, reason, latencyMs. Включённый renderer обязателен для readiness.
      properties:
        required: { type: boolean }
        enabled: { type: boolean }
        ok: { type: boolean }
        status: { type: string, enum: [ok, unavailable, disabled] }
        binary: { type: string }
        version: { type: string }
        error: { type: string }
        reason: { type: string }
        latencyMs: { type: number, minimum: 0 }
    D2ImporterHealth:
      type: object
      required: [required, ok, status, binary, parser, error, reason, latencyMs]
      description: >
        Локальный запуск importer с минимальным D2. ok требует успешного процесса,
        JSON IR version >= 4 и отсутствия source.errors. required всегда true,
        независимо от включения renderer; это не сетевой endpoint.
      properties:
        required: { type: boolean, enum: [true] }
        ok: { type: boolean }
        status: { type: string, enum: [ok, unavailable] }
        binary: { type: string }
        parser: { type: string }
        error: { type: string }
        reason: { type: string }
        latencyMs: { type: number, minimum: 0 }
    CacheStatus:
      type: object
      properties:
        success:
          type: boolean
        redis:
          $ref: "#/components/schemas/RedisStatus"
        memory:
          type: object
          properties:
            runtimeEntries:
              type: integer
            staticSnapshotEntries:
              type: integer
            inFlightRuntimeBuilds:
              type: integer
    LoggingStatus:
      type: object
      properties:
        success:
          type: boolean
        logging:
          type: object
          properties:
            level:
              type: string
              enum: [debug, info, warn, error, silent]
            format:
              type: string
              enum: [json, text]
            targets:
              type: array
              items:
                type: string
                enum: [stdout, syslog]
            diagnostic:
              type: object
              properties:
                mode:
                  type: string
                  enum: [off, Basic, Verbose]
                enabled:
                  type: boolean
                levels:
                  type: array
                  items:
                    type: string
                    enum: [Basic, Verbose]
                policy:
                  type: object
                  properties:
                    basic:
                      type: string
                    verbose:
                      type: string
            redactHeaders:
              type: array
              items:
                type: string
            redactQuery:
              type: array
              items:
                type: string
            syslog:
              nullable: true
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                protocol:
                  type: string
                  enum: [udp, tcp]
                facility:
                  type: string
            elk:
              type: object
              properties:
                directOutput:
                  type: boolean
                recommendedPipeline:
                  type: string
    TemplatePayload:
      type: object
      required: [code, spec]
      properties:
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        spec:
          type: object
          description: >
            Spec JSON шаблона. Обычные динамические шаблоны используют модель
            DSL steps/result; специальные шаблоны представления модели CMDBuild задают
            `kind=cmdbBuildView` и хранят настройки рендерера в `cmdbBuildView`.
            Каноническое состояние редактирования Assistant и D2 находится в `spec.authoring`:
            версия, запросы Assistant, исходный код D2 и его хэш. Хранилище
            принимает неполный раздел редактирования; пути выполнения проверяют его
            строго.
          additionalProperties: true
        expectedSpecHash:
          type: string
          description: Необязательная оптимистическая защита обновления. Если передана при обновлении, backend возвращает 409 при несовпадении хэша сохранённого spec шаблона.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          additionalProperties: true
        resultSchema:
          type: object
          additionalProperties: true
    TemplateCard:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
          nullable: true
        spec:
          type: object
          additionalProperties: true
        specHash:
          type: string
          description: SHA-256 нормализованного spec шаблона, используемый Designer как expectedSpecHash при обновлении.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          nullable: true
          additionalProperties: true
        resultSchema:
          type: object
          nullable: true
          additionalProperties: true
        owner:
          type: string
        updatedAt:
          type: string
          nullable: true
        protected:
          type: boolean
    TemplateResponse:

      x-flow-id: OAPI26
      tags: [templates]
      summary: Проверить сохранённый шаблон
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Результат проверки
  /cmdbuild/custom-api/templates/{code}/preview:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      x-flow-id: OAPI27
      tags: [templates]
      summary: Предварительный просмотр сохранённого шаблона
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Результат предварительного просмотра
  /cmdbuild/custom-api/templates/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
      - $ref: "#/components/parameters/RuntimeRoot"
    get:
      x-flow-id: OAPI28
      tags: [runtime]
      summary: Выполнение шаблона только для чтения
      description: >
        Прямой вызов требует действительную сессию CMDBuild, CSRF не требуется.
        Динамический шаблон выполняется под текущей сессией. Типизированные
        значения из snapshotParams передаются в выполнение без преобразования
        в строки, в том числе при переходе по ссылке прежнего снимка.
        Если проверка доступа не подтвердила возможность использовать кэш или
        не завершилась полностью, кэш результата не читается и не записывается.
        Выполнение читает данные напрямую под той же сессией с теми же лимитами.
        При успешном обходе кэша возвращаются cache.status=bypass и
        cache.reason=access_probe_unconfirmed. Явный отказ при чтении данных
        возвращается как 403 без частичных результатов. Если CMDBuild маскирует
        отказ ответом 404, он может классифицироваться как общая ошибка выполнения.
        Разрешённый пустой результат возвращается как 200 с пустыми строками
        и emptyText. Для staticSnapshot читается только опубликованный снимок
        выбранного root. События проходят через стандартное логирование backend.
      parameters:
        - $ref: "#/components/parameters/RuntimeSnapshotParams"
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: noCache
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: json
          in: query
          description: Зарезервированный флаг вывода результата выполнения. При true/1/yes возвращает конечный результат в формате application/json вместо обычной оболочки ответа API, используемой HTML-оболочкой выполнения.
          schema:
            type: string
            enum: ["true", "1", "yes"]
      responses:
        "200":
          $ref: "#/components/responses/RuntimeRunResult"
        "400":
          description: Недопустимый root, параметры или определение шаблона
        "401":
          $ref: "#/components/responses/RuntimeSessionRequired"
        "403":
          $ref: "#/components/responses/RuntimeAccessDenied"
        "404":
          description: Шаблон не найден в выбранном root
    post:
      x-flow-id: OAPI29
      tags: [runtime]
      summary: Прямое выполнение шаблона
      description: >
        Требует действительную сессию CMDBuild и CSRF. Правила доступа к данным
        и обхода кэша совпадают с GET. forceRefresh снимает интервал ожидания,
        но не позволяет читать или писать кэш без подтверждения проверки доступа.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: forceRefresh
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          $ref: "#/components/responses/RuntimeRunResult"
        "400":
          description: Недопустимый root, параметры или определение шаблона
        "401":
          $ref: "#/components/responses/RuntimeSessionRequired"
        "403":
          $ref: "#/components/responses/RuntimeAccessDenied"
        "404":
          description: Шаблон не найден в выбранном root
  /cmdbuild/custom-api/templates/{code}/publish:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
      - $ref: "#/components/parameters/RuntimeRoot"
    post:
      x-flow-id: OAPI30
      tags: [runtime]
      summary: Опубликовать статический снимок в Redis
      description: >
        Требует действительную сессию издателя, право обновления шаблона,
        сохранённый режим staticSnapshot с подтверждённым предупреждением и CSRF.
        Данные читаются под сессией издателя; при отказе чтения частичный снимок
        не публикуется. Ключ снимка включает технический класс шаблона и Code.
        Сохранённая версия и поколение отзыва проверяются перед вычислением и записью.
        Если после начала выполнения шаблон изменили или удалили, снимок не записывается.
        Снимки со старым ключом требуется переопубликовать.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [savedSpecHash]
              properties:
                savedSpecHash:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
                  description: Хеш утверждённой версии из ответа на сохранение.
                params:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Снимок опубликован
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
        "400":
          description: Недопустимый root, параметры или настройки публикации
        "401":
          description: Cookie издателя отсутствует
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSessionError"
        "403":
          $ref: "#/components/responses/RuntimeAccessDenied"
        "409":
          description: Сохранённая версия изменилась или отзыв прежней публикации требует сверки
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TemplateVersionConflict"
                  - type: object
                    required: [reason, message]
                    properties:
                      reason: { type: string, enum: [snapshot_revocation_pending] }
                      message: { type: string }
        "503":
          $ref: "#/components/responses/RuntimeSnapshotStorageUnavailable"
  /cmdbuild/custom-api/public-snapshots/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
      - $ref: "#/components/parameters/RuntimeRoot"
    get:
      x-flow-id: OAPI31
      tags: [runtime]
      security: []
      summary: Получить публичный статический снимок
      description: >
        Читает явно опубликованный статический снимок по root, коду и
        бизнес-параметрам, независимо от cookie и без вызова CMDBuild.
        При отсутствии снимка JSON содержит snapshotFound=false.
        Для выдачи D2 требуется явный publish.publicD2Source=true в снимке.
        Используется текущий ключ с техническим классом и поколением отзыва.
        Снимки со старыми ключами не читаются. Ответы не кэшируются по HTTP.
      parameters:
        - $ref: "#/components/parameters/RuntimeD2"
        - $ref: "#/components/parameters/RuntimeD2Diagram"
        - $ref: "#/components/parameters/RuntimeSnapshotParams"
      responses:
        "200":
          description: Снимок или признак его отсутствия в JSON либо D2 source
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
            text/vnd.d2:
              schema: { type: string }
        "400":
          description: Недопустимый root, код или формат snapshotParams
        "403":
          description: Публичный снимок не разрешает скачивание D2
        "404":
          description: Запрошенный D2 source недоступен
        "503":
          $ref: "#/components/responses/RuntimeSnapshotStorageUnavailable"
  /cmdbuild/custom-api/draft/validate:
    post:
      x-flow-id: OAPI32

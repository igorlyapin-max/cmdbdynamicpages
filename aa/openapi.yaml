          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportApplyResponse"
        "400":
          description: Некорректное тело запроса либо текущий исходный код D2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "401":
          description: Сессия CMDBuild недействительна либо истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "409":
          description: Черновик редактора, сохранённый шаблон, исходный код либо подписанное предложение изменились после анализа D2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "413":
          description: Запрос либо нормализованное сопоставление превышает настроенный лимит редактирования
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DiagramImportErrorResponse"
                  - $ref: "#/components/schemas/InputCollectionLimitError"
        "415":
          description: Тип содержимого запроса отличается от application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "422":
          description: Не разрешены сопоставления структуры или правила связей либо итоговый spec некорректен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "429":
          description: Достигнут лимит выполнения операций редактирования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "502":
          description: Каталог CMDBuild недоступен для детерминированной проверки сопоставлений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
  /cmdbuild/custom-api/assistant/diagram-import/interpret:
    post:
      x-flow-id: OAPI35
      tags: [assistant]
      summary: Предложить семантическую интерпретацию импортированных ролей D2
      description: >
        Предложение LLM только для редактирования на основе подписанного контекста
        проверки импорта D2. Исходный код D2, структурное IR и внутренние поля
        подписанного предложения не передаются модели. Ответ содержит только
        семантику ролей и не меняет настройки Diagram либо spec редактора.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDiagramImportInterpretRequest"
      responses:
        "200":
          description: Предложения семантики ролей
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportInterpretResponse"
        "400":
          description: Некорректное тело запроса либо входные данные Assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "401":
          description: Сессия CMDBuild недействительна либо истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "409":
          description: Сохранённый шаблон, исходный код либо подписанное предложение изменились после анализа D2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "413":
          description: Запрос либо очищенный контекст Assistant превышает настроенный лимит
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AssistantDiagramErrorResponse"
                  - $ref: "#/components/schemas/InputCollectionLimitError"
        "415":
          description: Тип содержимого запроса отличается от application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "422":
          description: Семантическое предложение Assistant не прошло детерминированную проверку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "429":
          description: Достигнут лимит выполнения операций редактирования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "502":
          description: Ошибка LiteLLM либо внешней зависимости Assistant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "503":
          description: Assistant выключен либо LiteLLM не настроен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "504":
          description: Запрос Assistant превысил настроенный таймаут этапа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
  /cmdbuild/custom-api/assistant/diagram-import/map-selections:
    post:
      x-flow-id: OAPI36
      tags: [assistant]
      summary: Предложить поэтапные сопоставления размещения и топологии D2
      description: >
        Предложение LLM только для редактирования. Этап roles сопоставляет каждый
        элемент structureTree с материализацией structural, stage либо parentCard.
        Если требуется сопоставление связей, HTTP 202 возвращает контрольную точку,
        а этап topology продолжает работу с тем же resumeId, сохраняя принятые размещения.
        Допустимые источники: именованные конечные результаты Object Flow;
        вспомогательные этапы исключены, если явный расширенный контракт не разрешает их.
        Возвращённые сопоставления остаются предложениями до явного детерминированного Apply.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDiagramImportMapSelectionsRequest"
      responses:
        "200":
          description: Завершённое предложение сопоставлений размещения и топологии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportMapSelectionsResponse"
        "202":
          description: Сопоставления размещения приняты; ожидается продолжение этапа topology
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportMapCheckpointResponse"
        "400":
          description: Некорректное тело запроса, stage либо resumeId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "401":
          description: Сессия CMDBuild недействительна либо истекла
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "409":
          description: Изменились поток редактора, исходный код, предложение, входные данные контрольной точки либо запрошенный этап продолжения
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "413":
          description: Запрос, очищенный контекст модели либо контрольная точка продолжения превышает настроенный лимит
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AssistantDiagramErrorResponse"
                  - $ref: "#/components/schemas/InputCollectionLimitError"
        "415":
          description: Тип содержимого запроса отличается от application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "422":
          description: Предложение сопоставлений Assistant не прошло детерминированную проверку
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "429":
          description: Достигнут лимит выполнения операций редактирования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "502":
          description: Ошибка каталога CMDBuild, LiteLLM либо другой внешней зависимости
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "503":
          description: Assistant выключен либо LiteLLM не настроен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
        "504":
          description: Текущий этап сопоставления превысил настроенный таймаут; выполнение можно продолжить
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramErrorResponse"
  /cmdbuild/custom-api/draft/preview:
    post:
      x-flow-id: OAPI37
      tags: [templates]
      summary: Предварительный просмотр несохранённого черновика
      description: >
        Assistant capture применяется только к Extraction: includeDiagrams=false,
        непустой extractionSource и без executionScope=diagrams. Trace scope задаётся
        query-параметром root и кодом черновика (в том числе template.code).
        Verbose trace хранит структурное описание и счётчики, но не параметры,
        карточки или тексты ошибок выполнения.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPayload"
      responses:
        "200":
          description: Результат предварительного просмотра
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "413":
          $ref: "#/components/responses/InputCollectionLimit"
  /cmdbuild/custom-api/draft/diagram-import/restore:
    post:
      x-flow-id: OAPI38
      tags: [templates]
      summary: Восстановить анализ D2 и сохранённое предложение Assistant
      description: >
        Требует действующую CMDBuild-сессию. Для существующего шаблона проверяет
        читаемую карточку и CAS baseSpecHash, но не _can_update; для нового
        проверяет _can_create технического класса. При отсутствии baseSpecHash
        использует hashJson(currentSpec || {}). D2 source берётся из
        currentSpec.authoring.d2.source либо сохранённого spec, не из d2Source.
        Проверяет source/structure/mapping/deterministic hashes checkpoint,
        перечитывает доступный каталог и повторно подписывает proposal.
        Ошибка optional assistantCheckpoint возвращается как warning в 200,
        если детерминированный анализ восстановлен. LiteLLM не вызывается;
        карточки и версии не сохраняются. Лимит тела равен
        D2_IMPORT_MAX_INPUT_BYTES + 2 * D2_IMPORT_ASSISTANT_CHECKPOINT_MAX_BYTES + 512 KiB.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportRestoreRequest"
      responses:
        "200":
          description: Анализ восстановлен; состояние остаётся локальным черновиком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportRestoreResponse"
        "400":
          $ref: "#/components/responses/DiagramBadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/DiagramForbidden"
        "409":
          $ref: "#/components/responses/DiagramConflict"
        "413":
          $ref: "#/components/responses/DiagramBodyTooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "422":
          $ref: "#/components/responses/DiagramInvalid"
        "429":
          $ref: "#/components/responses/ExecutionLimited"
        "502":
          $ref: "#/components/responses/DiagramUpstreamFailed"
  /cmdbuild/custom-api/draft/diagram-import/refresh:
    post:
      x-flow-id: OAPI39
      tags: [templates]
      summary: Обновить D2 source без изменения применённой структуры mapping
      description: >
        Проверки сессии и прав такие же, как у restore; baseSpecHash для
        существующего шаблона обязателен, автоматического вычисления нет.
        currentSpec должен содержать применённый d2Import версии 3 с
        structureHash и mappingContractHash. Изменение структуры или mapping
        contract даёт 409 и требует нового analyze/apply. При успехе возвращает
        новый spec, не сохраняет CMDBuild-карточку и не вызывает LiteLLM.
        Лимит тела D2_IMPORT_MAX_INPUT_BYTES + 512 KiB.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportRefreshRequest"
      responses:
        "200":
          description: Source обновлён в возвращённом черновике
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportRefreshResponse"
        "400":
          $ref: "#/components/responses/DiagramBadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/DiagramForbidden"
        "409":
          $ref: "#/components/responses/DiagramConflict"
        "413":
          $ref: "#/components/responses/DiagramBodyTooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "422":
          $ref: "#/components/responses/DiagramInvalid"
        "429":
          $ref: "#/components/responses/ExecutionLimited"
        "502":
          $ref: "#/components/responses/DiagramUpstreamFailed"
  /cmdbuild/custom-api/auth/capabilities:
    get:
      x-flow-id: OAPI40
      tags: [session]
      summary: Проверить доступность ролевых каталогов текущей сессии
      description: >
        Запрашивает sessions/current, roles?limit=100, users?limit=1,
        groups?limit=1 и текущую роль. HTTP 200 определяется только успехом
        sessions/current; недоступные каталоги дают false и upstream status

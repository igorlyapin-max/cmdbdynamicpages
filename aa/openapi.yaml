  /cmdbuild/custom-api/draft/diagram-import/restore:
    post:
      x-flow-id: OAPI38
      tags: [templates]
      summary: Восстановить анализ D2 и сохранённое предложение Assistant
      description: >
        Требует действующую CMDBuild-сессию. Для существующего шаблона проверяет
        читаемую карточку и CAS baseSpecHash, но не _can_update; для нового
        проверяет _can_create технического класса. При отсутствии baseSpecHash
        использует hashJson(currentSpec || {}). D2 source берётся из
        currentSpec.authoring.d2.source либо сохранённого spec, не из d2Source.
        Проверяет source/structure/mapping/deterministic hashes checkpoint,
        перечитывает доступный каталог и повторно подписывает proposal.
        Ошибка optional assistantCheckpoint возвращается как warning в 200,
        если детерминированный анализ восстановлен. LiteLLM не вызывается;
        карточки и версии не сохраняются. Лимит тела равен
        D2_IMPORT_MAX_INPUT_BYTES + 2 * D2_IMPORT_ASSISTANT_CHECKPOINT_MAX_BYTES + 512 KiB.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportRestoreRequest"
      responses:
        "200":
          description: Анализ восстановлен; состояние остаётся локальным черновиком
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportRestoreResponse"
        "400":
          $ref: "#/components/responses/DiagramBadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/DiagramForbidden"
        "409":
          $ref: "#/components/responses/DiagramConflict"
        "413":
          $ref: "#/components/responses/DiagramBodyTooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "422":
          $ref: "#/components/responses/DiagramInvalid"
        "429":
          $ref: "#/components/responses/ExecutionLimited"
        "502":
          $ref: "#/components/responses/DiagramUpstreamFailed"
  /cmdbuild/custom-api/draft/diagram-import/refresh:
    post:
      x-flow-id: OAPI39
      tags: [templates]
      summary: Обновить D2 source без изменения применённой структуры mapping
      description: >
        Проверки сессии и прав такие же, как у restore; baseSpecHash для
        существующего шаблона обязателен, автоматического вычисления нет.
        currentSpec должен содержать применённый d2Import версии 3 с
        structureHash и mappingContractHash. Изменение структуры или mapping
        contract даёт 409 и требует нового analyze/apply. При успехе возвращает
        новый spec, не сохраняет CMDBuild-карточку и не вызывает LiteLLM.
        Лимит тела D2_IMPORT_MAX_INPUT_BYTES + 512 KiB.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportRefreshRequest"
      responses:
        "200":
          description: Source обновлён в возвращённом черновике
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportRefreshResponse"
        "400":
          $ref: "#/components/responses/DiagramBadRequest"
        "401":
          $ref: "#/components/responses/SessionRequired"
        "403":
          $ref: "#/components/responses/DiagramForbidden"
        "409":
          $ref: "#/components/responses/DiagramConflict"
        "413":
          $ref: "#/components/responses/DiagramBodyTooLarge"
        "415":
          $ref: "#/components/responses/JsonRequired"
        "422":
          $ref: "#/components/responses/DiagramInvalid"
        "429":
          $ref: "#/components/responses/ExecutionLimited"
        "502":
          $ref: "#/components/responses/DiagramUpstreamFailed"
  /cmdbuild/custom-api/auth/capabilities:
    get:
      x-flow-id: OAPI40
      tags: [session]
      summary: Проверить доступность ролевых каталогов текущей сессии
      description: >
        Запрашивает sessions/current, roles?limit=100, users?limit=1,
        groups?limit=1 и текущую роль. HTTP 200 определяется только успехом
        sessions/current; недоступные каталоги дают false и upstream status
        в probes, а не 403 всего ответа. Не является разрешением на запись.
      responses:
        "200":
          description: Сессия прочитана, результаты независимых проверок доступны
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilitiesResponse"
        "401":
          $ref: "#/components/responses/CookieMissing"
        "502":
          description: sessions/current вернул не-2xx; тело сохраняет probes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilitiesResponse"
  /cmdbuild/custom-api/client-log:
    get:
      x-flow-id: L0
      tags: [diagnostics]
      summary: Прочитать журнал клиента либо добавить событие через query
      description: >
        Проверяет только наличие cookie, без проверки sessions/current.
        stage с непустым значением добавляет событие и возвращает весь bounded
        in-memory журнал; без stage только читает. clear=1 очищает журнал перед
        добавлением и требует same-origin Origin/Referer и CSRF. Для чтения и
        добавления через stage эти проверки отсутствуют в текущем обработчике.
        Журнал общий для процесса, не изолирован по пользователям и не заменяет
        structured logging sink. В query нельзя передавать секреты или ПДн.
      parameters:
        - $ref: "#/components/parameters/LogClear"
        - $ref: "#/components/parameters/ConditionalLogCsrf"
        - name: stage
          in: query
          schema: { type: string }
          description: Имя этапа; сохраняется не более 120 символов
        - name: href
          in: query
          schema: { type: string }
          description: Адрес, обрабатываемый sanitizeDiagnosticHref
        - name: message
          in: query
          schema: { type: string }
          description: Сообщение; сохраняется не более 500 символов
      responses:
        "200":
          description: Текущие записи клиентского журнала
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClientLogEntry"
        "401":
          $ref: "#/components/responses/CookieMissing"
        "403":
          description: Только при clear=1 отсутствует same-origin заголовок либо CSRF
    post:
      x-flow-id: L0
      x-supported: false
      tags: [diagnostics]
      summary: POST записи клиентского журнала не поддержан runtime
      description: >
        Зафиксирован отрицательный контракт, не новый способ записи. С cookie
        methodAllowed отвергает POST до чтения тела и CSRF; без cookie даёт 401.
        Используемая реализацией запись идёт через GET с stage.
      responses:
        "401":
          $ref: "#/components/responses/CookieMissing"
        "405":
          description: Метод POST отклонён, запись не создаётся
          headers:
            Allow:
              schema: { type: string, enum: [GET] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendError"
  /cmdbuild/custom-api/proxy-log:
    get:
      x-flow-id: L1
      tags: [diagnostics]
      summary: Прочитать либо очистить журнал proxy
      description: >
        Только наличие cookie, без sessions/current. Возвращает общий bounded
        in-memory журнал proxy. clear=1 требует same-origin Origin/Referer и
        CSRF; обычное чтение не требует этих заголовков.
      parameters:
        - $ref: "#/components/parameters/LogClear"
        - $ref: "#/components/parameters/ConditionalLogCsrf"
      responses:
        "200":
          description: Текущие записи proxy-журнала
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProxyLogEntry"
        "401":
          $ref: "#/components/responses/CookieMissing"
        "403":
          description: Только при clear=1 отсутствует same-origin заголовок либо CSRF
  /cmdbuild/custom-api/session-probe:
    get:
      x-flow-id: OAPI41
      tags: [session]
      summary: Диагностический alias текущей сессии
      description: Тот же обработчик и преобразование upstream status, что у /session
      responses:
        "200":
          description: Сессия прочитана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProbeResponse"
        "401":
          $ref: "#/components/responses/CookieMissing"
        "502":
          description: Неуспех sessions/current, включая upstream 401/403
  /cmdbuild/custom-api/model/domains/{domainName}:
    get:
      x-flow-id: OAPI42
      tags: [model]
      summary: Прочитать метаданные одного домена
      parameters:
        - name: domainName
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Отфильтрованные метаданные домена
          content:
            application/json:
              schema:
                type: object
                required: [success, cmdbuildStatus, domain]
                properties:
                  success: { type: boolean }
                  cmdbuildStatus: { type: integer }
                  domain:
                    type: object
                    nullable: true
                    additionalProperties: true
        "401":
          $ref: "#/components/responses/CookieMissing"
        "404":
          description: Некорректный route с пустым именем либо дополнительным slash
        "502":
          description: CMDBuild вернул не-2xx, в том числе upstream 403/404; domain=null
  /cmdbuild/custom-api/classes-probe:
    get:
      x-flow-id: OAPI43
      tags: [diagnostics]
      summary: Проверить чтение первой доступной CMDBuild class
      responses:
        "200":
          description: Результат запроса classes?limit=1; не проверка всех прав
          content:
            application/json:
              schema:
                type: object
                required: [success, receivedCmdbuildCookie, forwardedAs, cmdbuildStatus, firstClass]
                properties:
                  success: { type: boolean }
                  receivedCmdbuildCookie: { type: boolean, enum: [true] }
                  forwardedAs: { type: string, enum: [CMDBuild-Authorization header] }
                  cmdbuildStatus: { type: integer }
                  firstClass:
                    type: object
                    nullable: true
                    properties:
                      name: { type: string }
                      description: { type: string }
                      canRead: { type: boolean }
                      canCreate: { type: boolean }
        "401":
          $ref: "#/components/responses/CookieMissing"
        "502":
          description: CMDBuild вернул не-2xx
  /cmdbuild/custom-api/health/live:
    get:
      x-flow-id: H0
      tags: [health]
      security: []
      summary: Alias /health/live под backend prefix
      responses:
        "200":
          description: Процесс работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /cmdbuild/custom-api/health/redis:
    get:
      x-flow-id: H1
      tags: [health]
      security: []
      summary: Alias /health/redis под backend prefix
      responses:
        "200":
          description: Redis доступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedisHealth"
        "503":
          description: Redis недоступен либо выключен
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RedisHealth"
                  - $ref: "#/components/schemas/HealthFailure"
  /cmdbuild/custom-api/health/ready:
    get:
      x-flow-id: H2
      tags: [health]
      security: []
      summary: Alias /health/ready под backend prefix
      responses:
        "200":
          description: Все обязательные зависимости готовы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Обязательная зависимость недоступна
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadyHealth"
                  - $ref: "#/components/schemas/HealthFailure"
  /cmdbuild/dynamicpages/ui:
    get:
      x-flow-id: OAPI44
      tags: [runtime]
      summary: Перенаправить авторизованного пользователя в Designer
      responses:
        "302":
          description: Сессия проверена через CMDBuild
          headers:
            Location:
              schema: { type: string, enum: [/cmdbuild/dynamicpages/ui/designer] }
        "401":
          $ref: "#/components/responses/UiSessionRequired"
  /cmdbuild/dynamicpages/ui/designer:
    get:
      x-flow-id: OAPI45
      tags: [runtime]
      summary: Открыть HTML оболочку Designer
      parameters:
        - $ref: "#/components/parameters/DesignerSection"
      responses:
        "200":
          $ref: "#/components/responses/UiShell"
        "401":
          $ref: "#/components/responses/UiSessionRequired"
  /cmdbuild/dynamicpages/ui/designer/{section}:
    get:
      x-flow-id: OAPI46
      tags: [runtime]
      summary: Открыть раздел Designer по path
      description: section query (затем cmdpSection) имеет приоритет над path
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DesignerSection"
      responses:
        "200":
          $ref: "#/components/responses/UiShell"
        "401":
          $ref: "#/components/responses/UiSessionRequired"
  /cmdbuild/dynamicpages/ui/run/{code}:
    get:
      x-flow-id: OAPI47
      tags: [runtime]
      summary: Открыть runtime оболочку либо получить JSON результата
      security:
        - {}
        - cmdbuildCookie: []
      description: >
        Без cookie HTML оболочка публична; её получение не означает доступность
        данных. При json=true без cookie делегирует public-snapshots/{code}/run,
        с валидной cookie делегирует templates/{code}/run. Невалидная переданная
        cookie даёт 401, без fallback на публичный режим. JSON статусы определяет
        целевой обработчик, query передаётся ему без изменений.
      parameters:
        - $ref: "#/components/parameters/TemplateCode"
        - name: json
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: HTML оболочка либо JSON результат целевого run
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Недопустимый template code или параметры run
        "401":
          $ref: "#/components/responses/UiSessionRequired"
        "403":
          description: JSON run запрещён правами или настройками публикации
        "404":
          description: Шаблон либо разрешённый публичный snapshot не найден
        default:
          description: Ошибка делегированного JSON run; см. соответствующий API-контракт
components:
  responses:
    CookieMissing:
      description: Cookie CMDBuild-Authorization отсутствует
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackendError"
    SessionRequired:
      description: Cookie отсутствует либо проверка сессии вернула upstream 400/401/403
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramBadRequest:
      description: Некорректный JSON/object, technical root, template code либо baseSpecHash
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramForbidden:
      description: Same-origin/CSRF отклонён либо нет _can_create для нового шаблона
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramConflict:
      description: Конфликт версии, checkpoint, source, structure либо mapping contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramBodyTooLarge:
      description: Превышен лимит байтов JSON-тела
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    JsonRequired:
      description: Content-Type должен начинаться с application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramInvalid:
      description: Невалидный D2, ошибка importer либо детерминированной обработки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    ExecutionLimited:
      description: Достигнут лимит выполнения для сессии либо процесса
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramUpstreamFailed:
      description: Недоступны проверка сессии, прав, карточки или нужного каталога CMDBuild
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    UiShell:
      description: HTML оболочка после проверки действующей сессии
      content:
        text/html:
          schema: { type: string }
    UiSessionRequired:
      description: Cookie отсутствует либо CMDBuild не подтвердил сессию; ответ HTML
      content:
        text/html:
          schema: { type: string }
  headers:
    CmdpVersion:
      description: Версия приложения, встроенная в запущенный образ.
      schema:
        type: string
    CmdpRevision:
      description: Полная ревизия Git, встроенная в запущенный образ, либо unknown для непроверенной локальной сборки.
      schema:
        type: string
    CmdpProvenance:
      description: Происхождение сборки, подтверждённое канонической процедурой сборки.
      schema:
        type: string
        enum: [verified, unverified-local]
    CmdpEditorSha256:
      description: SHA-256 исходного кода backend редактора, обслуживаемого этим процессом.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
    csrfHeader:
      type: apiKey
      in: header
      name: X-CMDBDynamicPages-CSRF
  parameters:
    LogClear:
      name: clear
      in: query
      description: Только строка 1 включает очистку; тогда обязательны CSRF и same-origin
      schema: { type: string }
    ConditionalLogCsrf:
      name: X-CMDBDynamicPages-CSRF
      in: header
      required: false
      description: Обязателен при clear=1; токен выдаётся GET /cmdbuild/custom-api/csrf
      schema: { type: string }
    DesignerSection:
      name: section
      in: query
      schema: { type: string }
      description: Раздел Designer; после приведения к нижнему регистру допускает a-z, 0-9 и дефис
    TemplateCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ClassName:
      name: className
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 100
    Start:
      name: start
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  requestBodies:
    RunParams:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              params:
                type: object
                additionalProperties: true
              refresh:
                type: boolean
              noCache:
                type: boolean
              forceRefresh:
                type: boolean
              bypassRefreshCooldown:
                type: boolean
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
      additionalProperties: true
    RuntimeJsonResult:
      type: object
      description: JSON-вывод выполнения при `json=true`. Успешный ответ может содержать пустые строки, если права текущего пользователя CMDBuild не позволяют видеть ни одного объекта.
      properties:
        success:
          type: boolean
        action:
          type: string
          example: run
        snapshotFound:
          type: boolean
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        params:
          type: object
          additionalProperties: true
        tables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
              mode:
                type: string
              columns:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    label:
                      type: string
              rows:
                type: array
                items:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: object
                      properties:
                        values:
                          type: object
                          additionalProperties: true
                        links:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              href:
                                type: string
                              text:
                                type: string
                              value:
                                type: string
                              target:
                                type: string
              emptyText:
                type: string
              truncated:
                type: boolean
        diagrams:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagram"
        emptyText:
          type: string
        cache:
          type: object
          nullable: true
          additionalProperties: true
    RuntimeDiagram:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [topology]
        layout:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              group:
                type: string
              href:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              label:
                type: string
        warnings:
          type: array
          items:
            type: string
        truncated:
          type: boolean
    AssistantObjectFlowPlanRequest:
      type: object
      additionalProperties: false
      required: [templateRef, editorDelta, intent, semanticPlan, resumeId]
      properties:
        templateRef:
          $ref: "#/components/schemas/AssistantTemplateRef"
        editorDelta:
          $ref: "#/components/schemas/AssistantEditorDelta"
        intent:
          $ref: "#/components/schemas/AssistantObjectFlowIntent"
        semanticPlan:
          type: object
          additionalProperties: true
          description: Ранее проверенный семантический план для того же намерения и контрольной точки.
        resumeId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{15,127}$"
    AssistantObjectFlowSemanticPlanRequest:
      type: object
      additionalProperties: false
      required: [templateRef, editorDelta, intent, stage, resumeId]
      properties:
        templateRef:
          $ref: "#/components/schemas/AssistantTemplateRef"
        editorDelta:
          $ref: "#/components/schemas/AssistantEditorDelta"
        intent:
          $ref: "#/components/schemas/AssistantObjectFlowIntent"
        stage:
          type: string
          enum: [context, plan]
        resumeId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{15,127}$"
    AssistantTemplateRef:
      type: object
      additionalProperties: false
      required: [root, templateCode, baseSpecHash]
      properties:
        root:
          type: string
          minLength: 1
        templateCode:
          type: string
          description: Пустое значение допустимо только при редактировании несохранённого локального черновика шаблона.
        baseSpecHash:
          type: string
          description: Пустое значение допустимо только при редактировании несохранённого локального черновика шаблона; иначе это хэш сохранённого шаблона для оптимистической проверки CAS при редактировании.
    AssistantEditorDelta:

          type: object
          x-input-collection-policy: full-spec
          additionalProperties: true
        analysisCheckpoint:
          $ref: "#/components/schemas/D2AnalysisCheckpoint"
        assistantCheckpoint:
          $ref: "#/components/schemas/D2AssistantCheckpoint"

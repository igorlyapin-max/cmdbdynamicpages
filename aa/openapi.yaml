    DiagramImportRestoreRequest:
      type: object
      required: [analysisCheckpoint]
      description: >
        Пустой templateCode означает новый шаблон. currentSpec можно не передавать
        при наличии читаемого сохранённого шаблона; source берётся из его authoring.
        Для восстановления именно сохранённой revision клиент передаёт baseSpecHash.
        Неизвестные поля обработчик не отклоняет.
      properties:
        root: { type: string }
        templateCode: { type: string }
        baseSpecHash:
          type: string
          pattern: "^[a-f0-9]{64}$"

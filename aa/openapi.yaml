        method: { type: string }
        path: { type: string }
        referer: { type: string }
        userAgent: { type: string }
    DiagramImportRestoreRequest:
      type: object
      required: [analysisCheckpoint]
      description: >
        Пустой templateCode означает новый шаблон. currentSpec можно не передавать

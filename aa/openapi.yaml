        receivedCmdbuildCookie: { type: boolean }
      additionalProperties: true
    InputCollectionLimitError:
      type: object
      additionalProperties: false
      required: [success, code, message, errors, limits]
      description: >
        Ранний HTTP 413 без обрезания входа. Возвращаются только безопасное
        сообщение, schema-owned путь с индексами, счётчики и операторские лимиты;
        значения payload, cookies, prompt и секреты не возвращаются.
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
          enum: [input_collection_limit]
        message:
          type: string
          description: Фиксированное безопасное сообщение без значений входных данных.
        requestId:
          type: string
          description: Необязательный идентификатор корреляции structured logs.
        diagnostics:
          type: object
          properties:
            assistantTrace:
              $ref: "#/components/schemas/AssistantDiagnosticReference"
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, actualCount, limit]
            properties:
              path:
                type: string
                description: Путь из известных полей схемы и индексов, а не произвольных ключей или значений payload.
              actualCount:
                type: integer
                minimum: 1
                description: Исходная длина коллекции либо накопленный суммарный счётчик до нормализации и deduplication.
              limit:
                type: integer
                minimum: 1
                maximum: 500000
                description: Нарушенный эффективный лимит коллекции, D2, бизнес-блоков/uses либо суммарного бюджета.
        limits:
          type: object
          required: [effective, meta]
          properties:
            effective:
              type: object
              required: [maxCollectionItems, maxTotalItems, d2MaxElements]
              properties:
                maxCollectionItems: { type: integer, minimum: 1, maximum: 50000 }
                maxTotalItems: { type: integer, minimum: 1, maximum: 500000 }
                d2MaxElements: { type: integer, minimum: 1, maximum: 50000 }
            meta:
              type: object
              required: [maxCollectionItems, maxTotalItems, d2MaxElements]
              properties:
                maxCollectionItems:
                  allOf:
                    - $ref: "#/components/schemas/InputCollectionLimitMetadata"
                    - type: object
                      properties:
                        absolute: { type: integer, enum: [50000] }
                maxTotalItems:
                  allOf:
                    - $ref: "#/components/schemas/InputCollectionLimitMetadata"
                    - type: object
                      properties:
                        absolute: { type: integer, enum: [500000] }
                d2MaxElements:
                  allOf:
                    - $ref: "#/components/schemas/InputCollectionLimitMetadata"
                    - type: object
                      properties:
                        absolute: { type: integer, enum: [50000] }
    InputCollectionLimitMetadata:

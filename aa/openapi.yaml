        коду шаблона и бизнес-параметрам: сначала точное совпадение, затем снимок
        с paramsMode=ignore для того же root и кода. Наличие и действительность
        cookie на выбор снимка не влияют. При совпадении CMDBuild не вызывается;
        выдача D2 разрешена только с явным publish.publicD2Source=true в снимке.
        При отсутствии снимка запрос с cookie переходит на защищённый путь
        с обычной проверкой сессии и прав. Без cookie остаётся публичный промах
        (snapshotFound=false для JSON), без выполнения шаблона.
        После 403 защищённого пути повторного
        поиска снимка нет. Ошибка поиска снимка даёт 503 с причиной
        snapshot_storage_unavailable без перехода на защищённый путь.
        Снимки со старым форматом ключа нужно переопубликовать; такой ключ не читается.
        HTTP-статус HTML оболочки не заменяет статус отдельного запроса данных.
      parameters:
        - $ref: "#/components/parameters/TemplateCode"
        - $ref: "#/components/parameters/RuntimeRoot"
        - $ref: "#/components/parameters/RuntimeSnapshotParams"
        - name: json
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/RuntimeD2"
        - $ref: "#/components/parameters/RuntimeD2Diagram"
      responses:
        "200":
          description: HTML оболочка, JSON результат или D2 source выбранного результата
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/html:
              schema: { type: string }
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
            text/vnd.d2:
              schema: { type: string }
        "400":
          description: Недопустимый root, код шаблона или параметры run
        "401":
          $ref: "#/components/responses/RuntimeSessionRequired"
        "403":
          description: >
            Защищённый путь отказал в доступе к технической схеме или бизнес-данным,
            либо выбранный публичный снимок не разрешает скачивание D2.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePermissionDenied"
        "404":
          description: Не найден защищённый шаблон или D2 source выбранного результата
        "503":
          $ref: "#/components/responses/RuntimeSnapshotStorageUnavailable"
        default:
          description: Прочая ошибка выполнения; см. соответствующий API-контракт
  /cmdbuild/custom-api/assistant/diagnostics/status:
    get:
      x-flow-id: OAPI48
      tags: [assistant, diagnostics]
      summary: Прочитать временный режим capture выбранного root
      description: >
        Все diagnostics операции требуют валидную CMDBuild cookie,
        admin_classes_modify и _can_read конфигурационного класса root.
        Ответы, включая ошибки, Cache-Control no-store. Режим по умолчанию Off;
        Basic сохраняет metadata, Verbose также bounded redacted тела.
        Capture общий для всех пользователей root, хранится в Redis отдельно от
        RuntimeConfig. Restart и сохранение policy не продлевают capture/retention.
      parameters:
        - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
      responses:
        "200":
          $ref: "#/components/responses/AssistantDiagnosticsStatus"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/assistant/diagnostics/capture:
    parameters:
      - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
      - $ref: "#/components/parameters/AssistantDiagnosticsCsrf"
    post:
      x-flow-id: OAPI49
      tags: [assistant, diagnostics]
      summary: Временно включить Basic или Verbose capture для root
      description: >
        Admin-only и чтение root config; same-origin Origin/Referer и CSRF.
        JSON body до 4096 bytes; confirmed=true подтверждает root-wide capture.
        durationSec ограничен сохранённым captureDurationSec и максимумом 3600.
        Policy не принимается из body; используется RuntimeConfig и deployment caps.
        Redaction до Redis; тела не идут в stdout или external log sinks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, confirmed]
              properties:
                mode: { type: string, enum: [Basic, Verbose] }
                confirmed: { type: boolean, enum: [true] }
                durationSec:
                  type: integer
                  minimum: 1
                  description: По умолчанию effective captureDurationSec policy; большее значение clamp, не новый постоянный режим
      responses:
        "200":
          $ref: "#/components/responses/AssistantDiagnosticsStatus"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
    delete:
      x-flow-id: OAPI50
      tags: [assistant, diagnostics]
      summary: Остановить capture без удаления traces
      description: >
        Admin-only и чтение root config; same-origin Origin/Referer и CSRF.
        Возвращает mode Off. Запрещает новый admission; уже принятые Redis traces
        могут завершить запись без продления исходного expiry. Не очищает историю.
      responses:
        "200":
          $ref: "#/components/responses/AssistantDiagnosticsStatus"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/assistant/diagnostics/traces:
    parameters:
      - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
    get:
      x-flow-id: OAPI51
      tags: [assistant, diagnostics]
      summary: Прочитать summaries traces выбранного root без тел
      description: Admin-only и чтение root config. Новые traces первыми; quota/TTL могут удалить старые traces.
      parameters:
        - name: requestId
          in: query
          schema: { type: string, maxLength: 256 }
        - name: templateCode
          in: query
          schema: { type: string, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Bounded summaries без request/response bodies; no-store
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [success, traces]
                properties:
                  success: { type: boolean, enum: [true] }
                  traces:
                    type: array
                    maxItems: 100
                    items:
                      $ref: "#/components/schemas/AssistantDiagnosticTraceSummary"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
    delete:
      x-flow-id: OAPI52
      tags: [assistant, diagnostics]
      summary: Очистить retained traces root без остановки capture
      description: >
        Admin-only и чтение root config; same-origin Origin/Referer и CSRF.
        Атомарное увеличение storage epoch инвалидирует pending/in-flight traces;
        последующая запись не восстанавливает очищенную историю. Capture не останавливается.
        Это root-scoped clear, не offline security purge всех roots проекта.
      parameters:
        - $ref: "#/components/parameters/AssistantDiagnosticsCsrf"
      responses:
        "200":
          description: Traces удалены; no-store
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/assistant/diagnostics/traces/{id}:
    parameters:
      - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
      - $ref: "#/components/parameters/AssistantDiagnosticTraceId"
    get:
      x-flow-id: OAPI53
      tags: [assistant, diagnostics]
      summary: Прочитать metadata trace и spans без тел
      description: >
        Admin-only и чтение root config. request/response исключены из каждого span;
        для тел нужен отдельный span GET или export. Асинхронная запись может ещё
        не быть доступна: UI повторяет чтение только известного pending reference
        максимум 5 секунд. 404 также возможен после истечения, eviction или clear
        и сам по себе не доказывает pending.
      responses:
        "200":
          $ref: "#/components/responses/AssistantDiagnosticTrace"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/assistant/diagnostics/traces/{id}/spans/{spanId}:
    parameters:
      - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
      - $ref: "#/components/parameters/AssistantDiagnosticTraceId"
      - name: spanId
        in: path
        required: true
        schema: { type: string, pattern: '^[a-fA-F0-9-]{36}$' }
    get:
      x-flow-id: OAPI54
      tags: [assistant, diagnostics]
      summary: Прочитать отдельный redacted span с доступными телами
      description: Admin-only и чтение root config. Basic не содержит тел; Verbose может содержать bounded invalid JSON в response.value.
      responses:
        "200":
          description: Redacted span; no-store
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [success, span]
                properties:
                  success: { type: boolean, enum: [true] }
                  span:
                    $ref: "#/components/schemas/AssistantDiagnosticSpan"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/assistant/diagnostics/traces/{id}/export:
    parameters:
      - $ref: "#/components/parameters/AssistantDiagnosticsRoot"
      - $ref: "#/components/parameters/AssistantDiagnosticTraceId"
    get:
      x-flow-id: OAPI55
      tags: [assistant, diagnostics]
      summary: Скачать redacted JSON trace с доступными телами
      description: >
        Admin-only и чтение root config. Envelope success/trace, не bare trace.
        Content-Disposition attachment с именем assistant-trace-<id>.json;
        no-store. Redaction не делает export публичными данными.
      responses:
        "200":
          $ref: "#/components/responses/AssistantDiagnosticTrace"
        default:
          $ref: "#/components/responses/AssistantDiagnosticsError"
  /cmdbuild/custom-api/template-transfer/export:
    post:
      x-flow-id: OAPI56
      tags: [templates]
      summary: Экспортировать текущее несохранённое определение шаблона
      description: >
        Перенос только между окружениями с одинаковой моделью CMDBuild.
        Принимает полный снимок текущего редактора, собранный как Save,
        включая Diagram, D2 source, Assistant prompts и схемы. Не записывает
        шаблон, версию, кэш или публикацию; LLM не вызывается. templateRef
        необязателен и не является доказательством доверия к source.
        Ограничение тела TEMPLATE_REQUEST_MAX_BYTES (CMDP_TEMPLATE_REQUEST_MAX_BYTES)
        совпадает с обычным Save.
        Runtime config, identity, history, snapshots и secrets не переносятся.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/TemplateTransferRoot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateTransferExportRequest"
      responses:
        "200":
          description: JSON envelope; браузер скачивает package как JSON Blob с fileName
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTransferExportResponse"
        "400":
          description: Некорректный JSON, root, template или Spec
        "401":
          description: Нет действительной CMDBuild session
        "403":
          description: Недостаточно прав либо CSRF/same-origin не пройдены
        "413":
          $ref: "#/components/responses/InputCollectionLimit"
        "415":
          description: Требуется application/json
        "502":
          description: Ошибка CMDBuild upstream
  /cmdbuild/custom-api/template-transfer/prepare:
    post:
      x-flow-id: OAPI57
      tags: [templates]
      summary: Подготовить импорт без записи в CMDBuild
      description: >
        Проверяет format/version/checksum/security и модель назначения,
        применяет только явные overrides. ID/URL не remap автоматически.
        При new проверяет право создания и отсутствие Code; новый черновик
        неактивен и не наследует identity источника. При replace обязательны
        существующий targetCode и baseSpecHash; identity, Code, activity,
        ownership и history назначения сохраняются. Prepare отклоняет устаревший
        baseSpecHash и возвращает changes.targetId и changes.targetRevision для
        явной ветки transferReplace при глобальном Save. Ревизия включает root,
        ID, Code, Spec, Description, schemas, Active, Owner и UpdatedAt.
        Только глобальный Save записывает шаблон и версию. UI подтверждает замену
        всего editor definition и каждую requiresConfirmation ссылку перед
        staging. Незавершённое определение можно открыть и исправить. Сохранение
        незавершённого импорта допустимо только как нового неактивного шаблона.
        Сохранение замены требует повторной проверки итоговой модели назначения.
        Нет LLM, автоматического Save/publish и миграции модели.
        Ограничение тела TEMPLATE_REQUEST_MAX_BYTES (CMDP_TEMPLATE_REQUEST_MAX_BYTES)
        совпадает с Save.
        Структурные лимиты применяет HTTP input pipeline, не pure transfer module:
        CMDP_INPUT_MAX_COLLECTION_ITEMS default 5000 / absolute 50000,
        CMDP_INPUT_MAX_TOTAL_ITEMS default 50000 / absolute 500000.
        Target checks используют runtime executionLimits назначения:
        maxClassesDefault=100, maxDomainsDefault=100, maxRestCallsDefault=250,
        maxTraversalDepthMax=5 по умолчанию. Фактические бюджеты возвращаются
        в checks.summary.limits; достижение бюджета даёт issue для review,
        а не автоматическое расширение поиска или вызов LLM.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/TemplateTransferRoot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateTransferPrepareRequest"
      responses:
        "200":
          description: Подготовленный локальный черновик и проблемы для review; записи нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateTransferPrepareResponse"
        "400":
          description: Некорректные JSON, format/version/checksum/security, Spec или overrides; template не возвращается
        "401":
          description: Нет действительной CMDBuild session
        "403":
          description: Недостаточно create/update/read permissions либо CSRF/same-origin не пройдены
        "404":
          description: Шаблон назначения replace не найден
        "409":
          description: Code нового шаблона занят либо baseline baseSpecHash устарел
        "413":
          $ref: "#/components/responses/InputCollectionLimit"
        "415":
          description: Требуется application/json
        "502":
          description: Ошибка CMDBuild upstream
components:
  responses:
    AssistantDiagnosticsStatus:
      description: Состояние capture; available/caps добавляются только status GET; no-store
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            type: object
            required: [success, status]
            properties:
              success: { type: boolean, enum: [true] }
              status:
                type: object
                required: [mode, activeUntil, policy]
                properties:
                  mode: { type: string, enum: [Off, Basic, Verbose] }
                  activeUntil: { type: string, format: date-time, nullable: true }
                  available: { type: boolean }
                  policy:
                    $ref: "#/components/schemas/AssistantDiagnosticsPolicy"
                  caps:
                    $ref: "#/components/schemas/AssistantDiagnosticsPolicyCaps"
    AssistantDiagnosticTrace:
      description: Trace envelope; metadata GET без тел, export с телами при Verbose; no-store
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
        Content-Disposition:
          description: Только export возвращает attachment filename
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [success, trace]
            properties:
              success: { type: boolean, enum: [true] }
              trace:
                $ref: "#/components/schemas/AssistantDiagnosticTrace"
    AssistantDiagnosticsError:
      description: >
        400 invalid root/filters/ID/JSON/confirmation; 401 нет валидной сессии;
        403 нет admin_classes_modify/root config read или CSRF/same-origin;
        404 trace/span не найден или истёк; 405 неподдержанный метод;
        413 capture body больше 4096 bytes; 415 нужен application/json;
        502 ошибка upstream проверки config access; 503 diagnostics unavailable.
        Ошибки также no-store. Redis не заменяется in-memory storage.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            type: object
            required: [success]
            properties:
              success: { type: boolean, enum: [false] }
              code: { type: string, description: При отказе storage assistant_diagnostics_unavailable }
              message: { type: string }
              status:
                type: object
                properties:
                  available: { type: boolean, enum: [false] }
    CookieMissing:
      description: Cookie CMDBuild-Authorization отсутствует
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BackendError"
    SessionRequired:
      description: Cookie отсутствует либо проверка сессии вернула upstream 400/401/403
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramBadRequest:
      description: Некорректный JSON/object, technical root, template code либо baseSpecHash
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramForbidden:
      description: Same-origin/CSRF отклонён либо нет _can_create для нового шаблона
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramConflict:
      description: Конфликт версии, checkpoint, source, structure либо mapping contract
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramBodyTooLarge:
      description: Превышен лимит байтов JSON-тела либо ранний лимит структурных входных коллекций
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/DiagramImportErrorResponse"
              - $ref: "#/components/schemas/InputCollectionLimitError"
    InputCollectionLimit:
      description: >
        HTTP 413 до нормализации, upstream-вызовов и сохранения: превышен
        настроенный лимит структурной коллекции либо суммарного числа элементов.
        Вход не обрезается. message и path не содержат значения входных данных.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InputCollectionLimitError"
    JsonRequired:
      description: Content-Type должен начинаться с application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramInvalid:
      description: Невалидный D2, ошибка importer либо детерминированной обработки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    ExecutionLimited:
      description: Достигнут лимит выполнения для сессии либо процесса
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    DiagramUpstreamFailed:
      description: Недоступны проверка сессии, прав, карточки или нужного каталога CMDBuild
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DiagramImportErrorResponse"
    UiShell:
      description: HTML оболочка после проверки действующей сессии
      content:
        text/html:
          schema: { type: string }
    UiSessionRequired:
      description: Cookie отсутствует либо CMDBuild не подтвердил сессию; ответ HTML
      content:
        text/html:
          schema: { type: string }
    RuntimeRunResult:
      description: Результат выполнения либо состояние снимка; при отсутствии снимка snapshotFound=false.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeJsonResult"
    TemplateMutationFailed:
      description: >
        CMDB отклонила запрос или результат записи не подтверждён. При
        snapshotRevocationPending=true не повторяйте запрос до сверки состояния.
        Ответ CMDB 202 либо 2xx с success=false не подтверждает запись.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SnapshotRevocationStatus"
              - type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [false] }
                  cmdbuildStatus:
                    type: integer
                    description: HTTP-статус CMDB. 0 означает, что ответ на запись не получен.
    SnapshotRevocationUnavailable:
      description: >
        Запись в CMDB не начата. При потере подтверждения Redis pending-маркер
        мог сохраниться; ответ содержит snapshotRevocationPending и ID операции.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SnapshotRevocationStatus"
              - type: object
                required: [success, code, reason, message]
                properties:
                  success: { type: boolean, enum: [false] }
                  code: { type: string, enum: [snapshot_revocation_unavailable] }
                  reason: { type: string, enum: [snapshot_revocation_unavailable] }
                  message: { type: string }
    RuntimeSnapshotStorageUnavailable:
      description: Ошибка поиска опубликованного снимка; защищённый путь не вызывается.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            type: object
            required: [success, reason]
            properties:
              success: { type: boolean, enum: [false] }
              reason: { type: string, enum: [snapshot_storage_unavailable] }
              message: { type: string }
    RuntimeSessionRequired:
      description: >
        Cookie отсутствует либо сессия недействительна или истекла
        (reason=cmdbuild_session_invalid для неподтверждённой сессии).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeSessionError"
    RuntimeAccessDenied:
      description: >
        Отказ в доступе к технической схеме (technical_schema_access_denied)
        или при чтении бизнес-данных (data_access_denied), без частичных
        результатов. POST также может быть отклонён проверкой same-origin/CSRF,
        а публикация — из-за отсутствия права обновления шаблона.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimePermissionDenied"
  headers:
    RequestId:
      description: Идентификатор запроса для поиска связанных событий в структурированных логах backend.
      schema: { type: string }
    CmdpVersion:
      description: Версия приложения, встроенная в запущенный образ.
      schema:
        type: string
    CmdpRevision:
      description: Полная ревизия Git, встроенная в запущенный образ, либо unknown для непроверенной локальной сборки.
      schema:
        type: string
    CmdpProvenance:
      description: Происхождение сборки, подтверждённое канонической процедурой сборки.
      schema:
        type: string
        enum: [verified, unverified-local]
    CmdpEditorSha256:
      description: SHA-256 исходного кода backend редактора, обслуживаемого этим процессом.
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
    csrfHeader:
      type: apiKey
      in: header
      name: X-CMDBDynamicPages-CSRF
  parameters:
    RuntimeSnapshotParams:
      name: snapshotParams
      in: query
      required: false
      description: Типизированные параметры для поиска exact-снимка и защищённого выполнения. JSON-массив пар имя/значение с уникальными именами и скалярными значениями. Нельзя смешивать с обычными бизнес-параметрами, передавать null или служебное имя.
      schema:
        type: string
        example: '[["enabled",false],["site",42]]'
    RuntimeRoot:
      name: root
      in: query
      description: >
        Технический root маршрута. Только если параметр отсутствует, сервер
        использует CMDBDYNAMICPAGES_ROOT или Cst_QueryTool, если переменная не
        задана. Пустое, недопустимое или повторное значение даёт HTTP 400
        с reason=invalid_runtime_root, без перехода к значению по умолчанию.
        root зарезервирован: не является бизнес-параметром шаблона и не входит
        в хеш бизнес-параметров. Хранение снимков разделено по root.
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
        example: Cst_QueryTool
    RuntimeD2:
      name: d2
      in: query
      description: При d2=true скачать D2 source, если источник доступен для выбранного результата.
      schema: { type: boolean, default: false }
    RuntimeD2Diagram:
      name: diagram
      in: query
      description: Селектор для d2=true; без селектора выбирается первая диаграмма с D2 source.
      schema: { type: string }
    TemplateTransferRoot:
      name: root
      in: query
      description: Технический root назначения; UI передаёт явно и привязывает async response к root/session/template
      schema: { type: string, default: Cst_QueryTool }
    AssistantDiagnosticsRoot:
      name: root
      in: query
      description: Технический root; всегда передавать явно для предотвращения диагностики другого root
      schema: { type: string, default: Cst_QueryTool }
    AssistantDiagnosticsCsrf:
      name: X-CMDBDynamicPages-CSRF
      in: header
      required: true
      description: Токен из GET /cmdbuild/custom-api/csrf; также нужен same-origin Origin или Referer
      schema: { type: string }
    AssistantDiagnosticTraceId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-fA-F0-9-]{36}$' }
    LogClear:
      name: clear
      in: query
      description: Только строка 1 включает очистку; тогда обязательны CSRF и same-origin
      schema: { type: string }
    ConditionalLogCsrf:
      name: X-CMDBDynamicPages-CSRF
      in: header
      required: false
      description: Обязателен при clear=1; токен выдаётся GET /cmdbuild/custom-api/csrf
      schema: { type: string }
    DesignerSection:
      name: section
      in: query
      schema: { type: string }
      description: Раздел Designer; после приведения к нижнему регистру допускает a-z, 0-9 и дефис
    TemplateCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ClassName:
      name: className
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 100
    Start:
      name: start
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  requestBodies:
    RunParams:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              params:
                type: object
                description: Бизнес-параметры; технический root передаётся только в query, не в params.
                additionalProperties: true
              refresh:
                type: boolean
              noCache:
                type: boolean
              forceRefresh:
                type: boolean
              bypassRefreshCooldown:
                type: boolean
  schemas:
    TemplateTransferExportRequest:
      type: object
      required: [template]
      properties:
        template:
          $ref: "#/components/schemas/TemplatePayload"
        templateRef:
          $ref: "#/components/schemas/AssistantTemplateRef"
    TemplateTransferDefinition:
      type: object
      additionalProperties: false
      required: [code, description, spec, paramsSchema, resultSchema]
      description: >
        Переносимое определение без id, activity, owner, history и runtime config.
        Содержит canonical authoring, но не доверенные подписи/сроки checkpoint.
      properties:
        code: { type: string }
        description: { type: string }
        spec:
          type: object
          x-input-collection-policy: full-spec
          required: [version]
          properties:
            version: { type: integer, enum: [1] }
          additionalProperties: true
        paramsSchema: { type: object, additionalProperties: true }
        resultSchema: { type: object, additionalProperties: true }
    TemplateTransferPackage:
      type: object
      additionalProperties: false
      required: [format, formatVersion, producerVersion, template, dependencies, checksum]
      description: >
        Единый .cmdp-template.json. checksum проверяет целостность canonical JSON,
        но не является подписью доверия источнику или каталогу назначения.
        Старые версии формата не поддержаны. Загружать неизменённым;
        адаптацию передавать отдельно в prepare.overrides.
        maxItems описывает абсолютный предел HTTP input pipeline;
        pure transfer module сам не задаёт глобальные collection caps.
      properties:
        format: { type: string, enum: [cmdbdynamicpages.template] }
        formatVersion: { type: integer, enum: [1] }
        producerVersion: { type: string, minLength: 1, maxLength: 128 }
        template:
          $ref: "#/components/schemas/TemplateTransferDefinition"
        dependencies:
          type: object
          required: [classes, directFields, domains, environmentReferences, inspection]
          properties:
            classes: { type: array, maxItems: 50000, description: 'CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.', items: { type: object, additionalProperties: true } }
            directFields: { type: array, maxItems: 50000, description: 'CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.', items: { type: object, additionalProperties: true } }
            domains: { type: array, maxItems: 50000, description: 'CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.', items: { type: object, additionalProperties: true } }
            environmentReferences:
              type: array
              maxItems: 50000
              description: CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.
              items:
                $ref: "#/components/schemas/TemplateTransferReference"
            inspection: { type: array, maxItems: 50000, description: 'CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.', items: { type: object, additionalProperties: true } }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    TemplateTransferReference:
      type: object
      required: [path, value, kind]
      properties:
        path: { type: string, description: 'JSON path от $.spec; элементы массивов адресуются индексами [0], [1] и т. д.' }
        value:
          description: JSON-значение ID карточки/справочника или URL; сохраняет исходный JSON type
          nullable: true
        kind: { type: string, enum: [card, lookup, url] }
        requiresConfirmation:
          type: boolean
          description: Подтверждение выполняется явно в UI после последнего prepare, не записывается сервером
        className: { type: string }
        lookupType: { type: string }
        parameterName:
          type: string
          description: Только checks при prepare; имя параметра, которому принадлежит физическое default-значение
        effective:
          type: boolean
          description: Только checks при prepare; используется ли это значение при запуске без явного параметра
        shadowedBy:
          type: string
          description: Только checks при prepare; JSON path действующего значения, затеняющего этот default; пустая строка для действующего значения
      additionalProperties: true
    TemplateTransferOverride:
      type: object
      additionalProperties: false
      required: [path, value]
      properties:
        path: { type: string, description: Явный путь environment reference от $.spec, возвращённый проверкой }
        value:
          description: Явное JSON-значение замены; без автоматического ID mapping
          nullable: true
    TemplateTransferPrepareRequest:
      type: object
      required: [package, mode]
      properties:
        package:
          $ref: "#/components/schemas/TemplateTransferPackage"
        mode: { type: string, enum: [new, replace] }
        targetCode:
          type: string
          description: Для new необязательный код назначения; для replace обязательный существующий Code
        baseSpecHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Обязателен для replace; текущий хеш сохранённого spec назначения для проверки в Prepare
        description:
          type: string
          description: Необязательное описание; при отсутствии используется trimmed описание источника
        overrides:
          type: array
          maxItems: 50000
          description: CMDP_INPUT_MAX_COLLECTION_ITEMS по умолчанию 5000; абсолютный предел 50000.
          default: []
          items:
            $ref: "#/components/schemas/TemplateTransferOverride"
    TemplateTransferExportResponse:
      type: object
      required: [success, package, fileName]
      properties:
        success: { type: boolean, enum: [true] }
        package:
          $ref: "#/components/schemas/TemplateTransferPackage"
        fileName: { type: string, description: Имя скачиваемого .cmdp-template.json }
    TemplateTransferIssue:
      type: object
      required: [path, code, message, severity, blocking]
      properties:
        path: { type: string }
        code:
          type: string
          description: >
            Включает template_transfer_override_shadowed для замены затенённого
            default и template_transfer_dependency_unverified для активной DSL
            зависимости без подтверждённого происхождения. Оба возвращаются
            с severity=error и checks.executionReady=false; draft остаётся редактируемым.
        message: { type: string }
        severity: { type: string, enum: [warning, error] }
        blocking: { type: boolean, enum: [false], description: Catalog/mapping issues не блокируют загрузку и редактирование }
      additionalProperties: true
    TemplateTransferPrepareResponse:
      type: object
      required: [success, template, checks, changes]
      properties:
        success: { type: boolean, enum: [true] }
        template:
          $ref: "#/components/schemas/TemplateCard"
        checks:
          type: object
          required: [status, issues, environmentReferences, summary, executionReady]
          properties:
            status: { type: string, enum: [ready, needsAttention] }
            issues:
              type: array
              items:
                $ref: "#/components/schemas/TemplateTransferIssue"
            environmentReferences:
              type: array
              items:
                $ref: "#/components/schemas/TemplateTransferReference"
            summary: { type: object, additionalProperties: true }
            executionReady: { type: boolean, description: 'false не мешает staging; сохранение незавершённого определения допускается только как новой неактивной копии' }
        changes:
          type: object
          additionalProperties: true
          properties:
            targetId:
              description: ID карточки назначения; возвращается для replace
              oneOf:
                - type: integer
                - type: string
            targetRevision:
              description: Ревизия назначения на момент Prepare; возвращается для replace
              type: string
              pattern: '^sha256:[a-f0-9]{64}$'
    RuntimeConfigResponse:
      type: object
      required: [success, config, diagnostics, warnings, effectiveAssistantDiagnostics]
      properties:
        success: { type: boolean, enum: [true] }
        root: { type: string }
        className: { type: string }
        cmdbuildStatus: { type: integer }
        config:
          type: object
          description: Карточка конфигурации; runtimeConfig содержит requested RAW числа, не effective caps
          properties:
            runtimeConfig:
              type: object
              properties:
                assistant:
                  type: object
                  properties:
                    llm:
                      type: object
                      properties:
                        maxTokens: { type: integer, minimum: 1, maximum: 9007199254740991, default: 16384 }
                        responseFormat:
                          type: string
                          enum: [json_object, prompt]
                          default: json_object
                          description: json_object передаёт response_format провайдеру; prompt оставляет только инструкцию. Автоматического переключения нет.
                      additionalProperties: true
                    diagnostics:
                      $ref: "#/components/schemas/AssistantDiagnosticsPolicy"
                  additionalProperties: true
              additionalProperties: true
          additionalProperties: true
        diagnostics:
          type: object
          required: [limits]
          properties:
            limits:
              type: array
              description: Только clamped settings; пустой массив при отсутствии clamp
              items:
                $ref: "#/components/schemas/RuntimeConfigLimitDetail"
        warnings:
          type: array
          items: { type: string }
        effectiveAssistantDiagnostics:
          $ref: "#/components/schemas/AssistantDiagnosticsPolicy"
      additionalProperties: true
    RuntimeConfigLimitDetail:
      type: object
      required: [settingPath, requested, effectiveLimit, clampedBy]
      properties:
        settingPath: { type: string, example: assistant.llm.maxTokens }
        requested: { type: integer, minimum: 1 }
        effectiveLimit: { type: integer, minimum: 1 }
        clampedBy:
          type: string
          description: Deployment ceiling env или связанное ограничение policy
          example: CMDP_ASSISTANT_LLM_MAX_TOKENS_ABSOLUTE
        clamped: { type: boolean }
        limitHit: { type: boolean }
      additionalProperties: true
    RuntimeConfigInvalidResponse:
      type: object
      required: [success, code, message, errors]
      properties:
        success: { type: boolean, enum: [false] }
        code: { type: string, enum: [runtime_config_invalid] }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              settingPath: { type: string }
              reason: { type: string, enum: [positiveIntegerRequired] }
              min: { type: integer, enum: [1] }
              message: { type: string }
      description: >
        maxTokens и diagnostics policy требуют positive safe integer JSON numbers.
        Строки, null, boolean, ноль, отрицательные, дробные и unsafe integers недопустимы.
        Валидные числа выше deployment caps сохраняются RAW с warnings, не дают 422.
    AssistantDiagnosticReference:
      type: object
      description: >
        Необязательный diagnostics.assistantTrace в ответе Assistant, не гарантия persistence.
        Запись асинхронна; pending означает известную запись в очереди,
        stored подтверждает запись Redis, discarded означает lifecycle/quota rejection,
        unavailable означает storage/control failure. Ошибка диагностики не меняет
        основной результат Assistant. Capture control читается фоновым Redis poll
        каждую 1 s; недоступный/старше 2 s control пропускает tracing с warning
        без ожидания Redis на пути Assistant. Memory хранит control cache, не payload fallback.
      properties:
        traceId: { type: string, nullable: true }
        requestId: { type: string }
        mode: { type: string, enum: [Basic, Verbose] }
        storageStatus: { type: string, enum: [pending, stored, discarded, unavailable] }
        warning: { type: string }
      additionalProperties: true
    AssistantDiagnosticsPolicy:
      type: object
      description: >
        Сохранённая requested RAW assistant.diagnostics policy или effective policy
        в effectiveAssistantDiagnostics/status; не активный режим.
        Effective значения clamp по deployment ceilings; maxBodyBytes не больше
        maxTraceBytes, maxTraceBytes не больше maxStoredBytes.
        Effective captureDurationSec/retentionSec дополнительно ограничены 3600/604800.
        Валидные RAW значения выше caps сохраняются без clamp.
      required: [captureDurationSec, retentionSec, maxBodyBytes, maxTraceBytes, maxStoredBytes]
      properties:
        captureDurationSec: { type: integer, minimum: 1, maximum: 9007199254740991, default: 900 }
        retentionSec: { type: integer, minimum: 1, maximum: 9007199254740991, default: 86400 }
        maxBodyBytes: { type: integer, minimum: 1, default: 8388608 }
        maxTraceBytes: { type: integer, minimum: 1, default: 33554432 }
        maxStoredBytes: { type: integer, minimum: 1, default: 268435456 }
    AssistantDiagnosticsPolicyCaps:
      type: object
      description: >
        Deployment ceilings CMDP_ASSISTANT_DIAGNOSTICS_<SNAKE_CASE_FIELD>_ABSOLUTE.
        Это ceilings, не defaults сохранённой policy и не активация capture.
      properties:
        captureDurationSec: { type: integer, default: 3600 }
        retentionSec: { type: integer, default: 604800 }
        maxBodyBytes: { type: integer, default: 8388608 }
        maxTraceBytes: { type: integer, default: 33554432 }
        maxStoredBytes: { type: integer, default: 268435456 }
    AssistantDiagnosticTraceSummary:
      type: object
      required: [id, traceId]
      properties:
        id: { type: string }
        traceId: { type: string }
        requestId: { type: string }
        templateCode: { type: string }
        action: { type: string }
        mode: { type: string, enum: [Basic, Verbose] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        statusCode: { type: integer, nullable: true }
        status: { type: string }
    AssistantDiagnosticTrace:
      allOf:
        - $ref: "#/components/schemas/AssistantDiagnosticTraceSummary"
        - type: object
          properties:
            spans:
              type: array
              description: Metadata GET исключает request/response; span GET и export возвращают доступные bounded тела
              items:
                $ref: "#/components/schemas/AssistantDiagnosticSpan"
            capture:
              type: object
              properties:
                activeUntil: { type: string, format: date-time, nullable: true }
                policy:
                  $ref: "#/components/schemas/AssistantDiagnosticsPolicy"
                truncated: { type: boolean }
                reason: { type: string }
              additionalProperties: true
            diagnostics:
              type: object
              properties:
                actualBytes: { type: integer }
                redacted: { type: boolean }
                truncated: { type: boolean }
                omitted: { type: boolean }
                reason: { type: string }
              additionalProperties: true
          additionalProperties: true
    AssistantDiagnosticSpan:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, description: Граница bff, mcp, cmdbuild или litellm }
        name: { type: string }
        method: { type: string }
        path: { type: string }
        durationMs: { type: number }
        statusCode: { type: integer }
        metadata:
          type: object
          description: >
            Bounded redacted metadata границы: effective limits, finish_reason,
            detailed usage, provider ID, content type/byte counts, parse error
            reason/position при наличии. Нет требования наличия provider-specific
            полей у всех spans; raw bodies здесь не публикуются.
          additionalProperties: true
        request:
          $ref: "#/components/schemas/AssistantDiagnosticBody"
        response:
          $ref: "#/components/schemas/AssistantDiagnosticBody"
      additionalProperties: true
    AssistantDiagnosticBody:
      type: object
      description: Только Verbose; redaction до Redis и до clipping. Проверять truncated до интерпретации value.
      required: [value, actualBytes, storedBytes, truncated, redacted]
      properties:
        value:
          description: Redacted JSON object/array/scalar или исходный invalid JSON text; oversized структура может быть заменена marker
          nullable: true
        actualBytes: { type: integer, minimum: 0 }
        storedBytes: { type: integer, minimum: 0 }
        truncated: { type: boolean }
        redacted: { type: boolean }
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        diagnostics:
          type: object
          properties:
            assistantTrace:
              $ref: "#/components/schemas/AssistantDiagnosticReference"
          additionalProperties: true
      additionalProperties: true
    RuntimeJsonResult:
      type: object
      description: JSON-результат выполнения. При json=true таблицы и диаграммы на верхнем уровне; обычный ответ API содержит result. Разрешённый пустой результат не является ошибкой доступа.
      properties:
        success:
          type: boolean
        action:
          type: string
          example: run
        snapshotFound:
          type: boolean
        result:
          type: object
          description: Результат в обычном ответе API без json=true.
          additionalProperties: true
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        params:
          type: object
          additionalProperties: true
        tables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
              mode:
                type: string
              columns:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    label:
                      type: string
              rows:
                type: array
                items:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: object
                      properties:
                        values:
                          type: object
                          additionalProperties: true
                        links:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              href:
                                type: string
                              text:
                                type: string
                              value:
                                type: string
                              target:
                                type: string
              emptyText:
                type: string
              truncated:
                type: boolean
        diagrams:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagram"
        emptyText:
          type: string
        cache:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            status:
              type: string
              description: bypass, если результат получен напрямую без чтения или записи кэша.
            reason:
              type: string
              description: access_probe_unconfirmed при успешном прямом выполнении после неподтверждённой проверки доступа.
    RuntimeDiagram:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        type:
          type: string

        "415":
          description: Тип содержимого запроса отличается от application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagramImportErrorResponse"
        "422":
          description: Ошибка разбора, компиляции D2 либо проверки импорта

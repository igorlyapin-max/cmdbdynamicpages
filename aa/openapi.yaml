    AssistantD2SemanticModel:
      type: object
      additionalProperties: false
      required: [kind, version, modelHash, roles]
      properties:
        kind:
          type: string
          enum: [D2SemanticModel]
        version:
          type: integer
          enum: [1]
        modelHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AssistantD2SemanticRole"
    AssistantD2SemanticRole:
      type: object
      additionalProperties: false
      required: [roleId, visualKind, labelTemplate, reason]
      properties:
        roleId:
          type: string
        visualKind:
          type: string
          enum: [node, container]
        labelTemplate:
          type: string
        reason:
          type: string
    AssistantD2BindingModel:
      type: object
      additionalProperties: false
      required: [kind, version, modelHash, placements, connections]
      properties:
        kind:
          type: string
          enum: [D2BindingModel]
        version:
          type: integer
          enum: [2]
        modelHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        placements:
          type: array
          items:
            $ref: "#/components/schemas/AssistantD2BindingPlacement"
        connections:
          type: array
          items:
            $ref: "#/components/schemas/AssistantD2BindingConnection"
    AssistantD2BindingPlacement:
      type: object
      additionalProperties: false
      required: [structureItemId, roleId, materialization, stageId, className, cardSourceId, labelTemplate, conditions, hierarchyConditions]
      properties:
        structureItemId:
          type: string
        roleId:
          type: string
        materialization:
          type: string
          enum: [structural, stage, parentCard, ""]
        stageId:
          type: string
        className:
          type: string
        cardSourceId:
          type: string
        labelTemplate:
          type: string
        conditions:
          $ref: "#/components/schemas/AssistantBindingConditions"
        hierarchyConditions:
          $ref: "#/components/schemas/AssistantBindingConditions"
    AssistantBindingConditions:
      description: Нормализованные условия сопоставления либо пустой объект, когда условия не заданы.
      anyOf:
        - type: object
          additionalProperties: false
        - $ref: "#/components/schemas/DiagramImportFilterSet"
    AssistantD2BindingConnection:
      type: object
      additionalProperties: false
      required: [d2ElementKey, d2ClassKey, sourceStageId, mode, sourceField, targetField, sourceOperator, targetOperator, labelTemplate, endpointScopeStructureItemId]
      properties:
        d2ElementKey:
          type: string
        d2ClassKey:
          type: string
        sourceStageId:
          type: string
        mode:
          type: string
        sourceField:
          type: string
        targetField:
          type: string
        sourceOperator:
          type: string
        targetOperator:
          type: string
        labelTemplate:
          type: string
        aggregation:
          $ref: "#/components/schemas/DiagramEdgeAggregation"
        endpointScopeStructureItemId:
          type: string
          description: Точное размещение контейнера, ограничивающее оба конца связи; пустая строка означает всю диаграмму.
    AssistantRequirementLedger:
      type: object
      additionalProperties: false
      required: [version, hash, requirements, warnings]
      description: Реестр исходных требований; содержит приватный исходный текст, не предназначенный для логирования целиком.
      properties:
        version:
          type: integer
          enum: [1]
        hash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRequirement"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRequirementWarning"
    AssistantRequirement:
      type: object
      additionalProperties: false
      required: [id, targetType, targetId, sourceKind, sourceText, start, end, kind]
      properties:
        id:
          type: string
          pattern: "^req_[a-f0-9]{64}$"
        targetType:
          type: string
          enum: [businessBlock, placement, connection]
        targetId:
          type: string
        sourceKind:
          type: string
          enum: [description, notes, d2Notes]
        sourceText:
          type: string
        start:
          type: integer
          minimum: 0
          description: Начальное смещение UTF-16 в исходном поле.
        end:
          type: integer
          minimum: 0
          description: Конечное смещение UTF-16, не включаемое в диапазон.
        kind:
          type: string
          enum: [directive, paragraph]
        directiveType:
          type: string
        directiveValue:
          type: string
        overriddenBy:
          type: array
          items:
            type: string
            pattern: "^req_[a-f0-9]{64}$"
    AssistantRequirementWarning:
      type: object
      additionalProperties: false
      required: [code, targetType, targetId, directiveType, requirementIds]
      properties:
        code:
          type: string
          enum: [assistant_requirement_directive_conflict]
        targetType:
          type: string
          enum: [businessBlock, placement, connection]
        targetId:
          type: string
        directiveType:
          type: string
        requirementIds:
          type: array
          items:
            type: string
            pattern: "^req_[a-f0-9]{64}$"
    AssistantRequirementCoverage:
      type: object
      additionalProperties: false
      required: [scope, semanticProof, entries]
      description: Учёт исходных требований по целям, не доказательство семантической полноты сопоставления.
      properties:
        scope:
          type: string
          enum: [source-target-accountability-only]
        semanticProof:
          type: boolean
          enum: [false]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AssistantRequirementCoverageEntry"
    AssistantRequirementCoverageEntry:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id:
          type: string
          pattern: "^req_[a-f0-9]{64}$"
        status:
          type: string
          enum: [compiled, unresolved, conflict]
        evidenceRefs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssistantRequirementEvidenceRef"
    AssistantRequirementEvidenceRef:
      type: object
      additionalProperties: false
      required: [family, ref]
      properties:
        family:
          type: string
          enum: [businessBlock, placement, connection]
        ref:
          type: string
    AssistantCoverageModel:
      type: object
      additionalProperties: false
      required: [kind, version, modelHash, status, requiredRoles, mappedRoles, requiredContainers, mappedContainers, staticPlacements, requiredConnections, mappedConnections, unresolved]
      properties:
        kind:
          type: string
          enum: [CoverageModel]
        version:
          type: integer
          enum: [2]
        modelHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        status:
          type: string
          enum: [partial, complete, ""]
        requiredRoles:
          type: integer
          minimum: 0
        mappedRoles:
          type: integer
          minimum: 0
        requiredContainers:
          type: integer
          minimum: 0
        mappedContainers:
          type: integer
          minimum: 0
        staticPlacements:
          type: integer
          minimum: 0
        requiredConnections:
          type: integer
          minimum: 0
        mappedConnections:
          type: integer
          minimum: 0
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
    AssistantDiagramMappingCheckpoint:
      type: object
      additionalProperties: false
      required: [resumeId, stage, nextStage, rolesReused, attempt, transientAttempt, correctionAttempt, automaticRetriesRemaining, correctionRetriesRemaining, checkpointTtlSec, expiresAt]
      properties:
        resumeId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{15,127}$"
        stage:
          type: string
          enum: [roles, topology]
        nextStage:
          type: string
          enum: [roles, topology]
        rolesReused:
          type: boolean
        attempt:
          type: integer
          minimum: 1
        transientAttempt:
          type: integer
          minimum: 0
        correctionAttempt:
          type: integer
          minimum: 0
        automaticRetriesRemaining:
          type: integer
          minimum: 0
        correctionRetriesRemaining:
          type: integer
          minimum: 0
        checkpointTtlSec:
          type: integer
          minimum: 1
        expiresAt:
          type: string
          format: date-time
    AssistantDiagramMappingResume:
      allOf:
        - $ref: "#/components/schemas/AssistantDiagramMappingCheckpoint"
      description: Та же сводка непрозрачной контрольной точки возвращается при допускающих повтор ошибках 422/502/503/504; повторно отправьте resumeId с указанным nextStage.
    AssistantDiagramCoverageCount:
      type: object
      additionalProperties: false
      required: [mapped, required]
      properties:
        mapped:
          type: integer
          minimum: 0
        required:
          type: integer
          minimum: 0
    AssistantDiagramMappingCoverage:
      type: object
      additionalProperties: false
      required: [status, requiredRoles, mappedRoles, staticContainers, staticPlacements, requiredContainers, mappedContainers, requiredConnections, mappedConnections, objectCoverage, containerCoverage, connectionCoverage, unresolved, missingMappings, missingConnectionMappings]
      properties:
        status:
          type: string
          enum: [partial, complete]
        requiredRoles:
          type: integer
          minimum: 0
        mappedRoles:
          type: integer
          minimum: 0
        staticContainers:
          type: integer
          minimum: 0
        staticPlacements:
          type: integer
          minimum: 0
        requiredContainers:
          type: integer
          minimum: 0
        mappedContainers:
          type: integer
          minimum: 0
        requiredConnections:
          type: integer
          minimum: 0
        mappedConnections:
          type: integer
          minimum: 0
        objectCoverage:
          $ref: "#/components/schemas/AssistantDiagramCoverageCount"
        containerCoverage:
          $ref: "#/components/schemas/AssistantDiagramCoverageCount"
        connectionCoverage:
          $ref: "#/components/schemas/AssistantDiagramCoverageCount"
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
        missingMappings:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
        missingConnectionMappings:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
    AssistantSemanticPlanErrorResponse:
      type: object
      additionalProperties: true
      required: [success, code, message, errors, diagnostics, retryable]
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        diagnostics:
          type: object
          additionalProperties: true
          description: >
            Диагностика доступности и полноты MCP-каталога, адресных проверок классов
            и сработавших ограничений. Для локального таймаута limits содержит
            settingPath, rawConfigured, effectiveLimit, elapsedMs и stage.
            Пустые или неизвестные сведения не доказывают полноту каталога.
        feedback:
          type: object
          nullable: true
          additionalProperties: true
          properties:
            code:
              type: string
              description: Стабильный код локализуемой диагностики, включая semanticPlanContextIncomplete.
            params:
              type: object
              additionalProperties: true
              description: >
                Параметры сообщения: пользовательский блок, основание привязки,
                причина, settingPath, requiredCount и effectiveLimit.
        retryable:
          type: boolean
        resume:
          type: object
          nullable: true
          additionalProperties: true
    AssistantDiagramErrorResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [assistant-diagram-import-interpret, assistant-diagram-import-map-selections]
        code:
          type: string
        reason:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
        warnings:
          type: array
          items:
            type: string
        retryable:
          type: boolean
        retryKind:
          type: string
          enum: [correction, transient]
        resume:
          allOf:
            - $ref: "#/components/schemas/AssistantDiagramMappingResume"
          nullable: true
        partial:
          type: boolean
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/DiagramSelectionMapping"
        relationRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRelationRule"
        connectionUnresolved:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDiagramIssue"
        structureTree:
          $ref: "#/components/schemas/DiagramImportStructureTree"
        mapping:
          allOf:
            - $ref: "#/components/schemas/AssistantDiagramMappingCoverage"
          nullable: true
        models:
          $ref: "#/components/schemas/AssistantDiagramModels"
        diagnostics:
          type: object
          additionalProperties: true

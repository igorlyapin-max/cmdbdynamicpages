        targetClass:
          type: string
        direction:
          type: string
          enum: [direct, inverse, both]
    DiagramEdgeAggregation:
      type: object
      additionalProperties: false
      description: >
        Необязательная агрегация бизнес-связей после разрешения конечных объектов
        и проверки структуры D2. Отсутствие объекта или enabled=false сохраняет
        отдельные связи. Листья используют существующий labelTemplate правила;
        отдельный шаблон подписи агрегации не поддерживается. Иерархические связи
        и статические фрагменты D2 не агрегируются.
      properties:
        enabled:
          type: boolean
          default: false
          description: Включает агрегацию только для данного правила связи.
        groupBy:
          type: array
          default: []
          maxItems: 32
          x-input-collection-policy: edge-aggregation-group-by
          description: >
            Упорядоченные поля выбранного источника, задающие уровни подписи.
            По умолчанию уровней нет. Фиксированный предел безопасности 32;
            превышение отклоняется, массив не обрезается. Общий настраиваемый
            предел коллекций не повышает этот предел.
          items:
            type: string
            minLength: 1
            pattern: "\\S"
        format:
          type: string
          enum: [compact, tree]
          default: compact
          description: compact выводит вложенные группы компактно; tree выводит уровни отдельными строками.
        duplicates:
          type: string
          enum: [distinct, preserve]
          default: distinct
          description: >
            distinct выводит одинаковый текст листа один раз внутри группы;
            preserve сохраняет повторяющийся текст разных исходных записей.
            Повторное обнаружение одной записи через несколько endpoint matches
            не создаёт дополнительную бизнес-запись.
        maxLabelChars:
          type: integer
          minimum: 64
          maximum: 20000
          default: 2000
          description: >
            Предел длины видимой подписи. Скрытые целые значения отмечаются
            в подписи и остаются в структурированных деталях связи.

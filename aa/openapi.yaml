          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Обязателен для существующего templateCode; иначе 409
        currentSpec:
          type: object
          x-input-collection-policy: full-spec
          additionalProperties: true
        d2Source:
          type: string
          description: Автономный D2 source без внешних imports
    D2AnalysisCheckpoint:
      type: object
      required: [proposalId, deterministicSpecHash, source, structureTree]
      description: >
        Минимальная форма, принимаемая normalizeD2AnalysisCheckpoint. version
        нормализуется в 1; roles и relationRules при отсутствии становятся [].
        Размер ограничен D2_IMPORT_ASSISTANT_CHECKPOINT_MAX_BYTES после нормализации.
      properties:
        version: { type: integer }
        proposalId: { type: string, minLength: 1 }
        deterministicSpecHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        source:
          type: object
          required: [hash, structureHash, mappingContractHash]
          properties:
            hash: { type: string, pattern: "^[a-f0-9]{64}$" }
            structureHash: { type: string, pattern: "^[a-f0-9]{64}$" }
            mappingContractHash: { type: string, pattern: "^[a-f0-9]{64}$" }
        roles:
          type: array
          maxItems: 50000
          x-input-collection-policy: d2
          description: CMDP_D2_IMPORT_MAX_ELEMENTS по умолчанию 5000, абсолютный предел 50000; также действуют общие входные лимиты.
          items:
            $ref: "#/components/schemas/DiagramImportRoleOverride"
        relationRules:
          type: array
          maxItems: 50000
          x-input-collection-policy: d2
          description: CMDP_D2_IMPORT_MAX_ELEMENTS по умолчанию 5000, абсолютный предел 50000; также действуют общие входные лимиты.
          items:
            $ref: "#/components/schemas/DiagramImportRelationRule"
        structureTree:
          $ref: "#/components/schemas/DiagramImportStructureTree"
    D2AssistantCheckpoint:

          description: >
            Надстройка сохранённого Assistant, version нормализуется в 3.
            Ошибки этой optional части не отменяют восстановление анализа.
          properties:
            interpretation: { type: object, additionalProperties: true }
            mapping: { type: object, additionalProperties: true }

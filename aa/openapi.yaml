          $ref: "#/components/schemas/AssistantDataSemanticModel"
        d2StructuralModel:
          $ref: "#/components/schemas/AssistantD2StructuralModel"
        d2SemanticModel:
          $ref: "#/components/schemas/AssistantD2SemanticModel"
        d2BindingModel:
          $ref: "#/components/schemas/AssistantD2BindingModel"
        coverageModel:
          $ref: "#/components/schemas/AssistantCoverageModel"
    AssistantDataSemanticModel:
      type: object
      additionalProperties: false
      required: [kind, version, modelHash, stages]
      properties:
        kind:
          type: string
          enum: [DataSemanticModel]
        version:
          type: integer
          enum: [3]
        modelHash:
          type: string
          pattern: "^[a-f0-9]{64}$"
        stages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantDataSemanticStage"
    AssistantDataSemanticStage:
      type: object
      additionalProperties: true
      required: [id, label, alias, kind, className, columns, readableFields, rules]
      properties:
        id:
          type: string
        label:
          type: string
        alias:
          type: string
        kind:
          type: string
        className:
          type: string
        from:
          type: string
        with:
          type: string
        operation:
          type: string

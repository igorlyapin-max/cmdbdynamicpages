openapi: 3.0.3
info:
  title: cmdbdynamicpages API
  version: 0.1.0
  description: >
    Backend-owned UI/API for CMDBuild dynamic pages. Dynamic endpoints run with
    the current CMDBuild session cookie. Health endpoints are unauthenticated.
    Каноническое Assistant/D2 authoring хранится в `spec.authoring`; версию
    шаблона записывает только обычный template POST/PUT.
servers:
  - url: http://127.0.0.1:8093
    description: Local dynamicpages backend
  - url: http://localhost:8088
    description: Local same-origin nginx front
tags:
  - name: health
  - name: diagnostics
  - name: session
  - name: model
  - name: schema
  - name: templates
  - name: runtime
  - name: assistant
    description: >
      API authoring-предложений. Assistant формирует object-flow, D2
      interpretation и selection-to-role предложения; ответы не сохраняют
      шаблон. Legacy `/assistant/template-draft`,
      `/assistant/diagram-import/complete` и
      `/templates/{code}/assistant-draft` не поддержаны и не запланированы;
      последний route возвращает 410.
  - name: mcp
  - name: config
security:
  - cmdbuildCookie: []
paths:
  /health/live:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Backend process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/redis:
    get:
      tags: [health]
      security: []
      summary: Strict Redis health probe
      responses:
        "200":
          description: Redis is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedisHealth"
        "503":
          description: Redis is unavailable or disabled
  /health/ready:
    get:
      tags: [health]
      security: []
      summary: Production readiness probe
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend is not ready
  /metrics:
    get:
      tags: [health]
      security: []
      summary: Prometheus metrics
      description: Returns aggregate operational counters and gauges only; cookies, tokens, user names, runtime rows, and raw CMDBuild payloads are not exposed.
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
                example: |
                  # HELP cmdp_health_ready Readiness status: 1 ready, 0 not ready.
                  # TYPE cmdp_health_ready gauge
                  cmdp_health_ready 1
        "500":
          description: Metrics rendering failed
  /cmdbuild/custom-api/cache/status:
    get:
      tags: [diagnostics]
      security: []
      summary: Diagnostic cache status
      description: Returns 200 even when Redis fallback to memory is active; do not use as strict readiness.
      responses:
        "200":
          description: Cache diagnostic status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatus"
  /cmdbuild/custom-api/logging/status:
    get:
      tags: [diagnostics]
      summary: Diagnostic logging configuration
      description: Returns active log level, target and redaction settings without secrets. This is not readiness.
      responses:
        "200":
          description: Logging diagnostic status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggingStatus"
        "401":
          description: CMDBuild session cookie is missing or invalid
  /cmdbuild/custom-api/session:
    get:
      tags: [session]
      summary: Current CMDBuild session
      responses:
        "200":
          description: Sanitized session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: CMDBuild session cookie is missing or invalid
  /cmdbuild/custom-api/model/catalog:
    get:
      tags: [model]
      summary: Current-user visible model catalog
      responses:
        "200":
          description: Classes, attributes, domains, lookups visible to current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes:
    get:
      tags: [model]
      summary: Visible CMDBuild classes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Start"
      responses:
        "200":
          description: Class list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes/{className}:
    get:
      tags: [model]
      summary: One CMDBuild class metadata
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Class metadata
        "403":
          description: Access denied
        "404":
          description: Class not found
  /cmdbuild/custom-api/model/classes/{className}/attributes:
    get:
      tags: [model]
      summary: Attributes visible for one class
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Attribute list
  /cmdbuild/custom-api/model/domains:
    get:
      tags: [model]
      summary: Visible CMDBuild domains
      parameters:
        - name: detailed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Domain list
  /cmdbuild/custom-api/auth/permission-scope:
    get:
      tags: [model]
      summary: Permission-scope diagnostics
      responses:
        "200":
          description: Diagnostic visible-model hashes and endpoint statuses
  /cmdbuild/custom-api/csrf:
    get:
      tags: [session]
      summary: Get custom API CSRF token
      responses:
        "200":
          description: CSRF token for non-GET calls
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
  /cmdbuild/custom-api/schema:
    get:
      tags: [schema]
      summary: Technical schema readiness
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
        - name: parent
          in: query
          schema:
            type: string
            example: Class
      responses:
        "200":
          description: Technical schema status
  /cmdbuild/custom-api/schema/parents:
    get:
      tags: [schema]
      summary: Candidate parent superclasses for technical schema
      responses:
        "200":
          description: Parent class list
  /cmdbuild/custom-api/schema/preview:
    post:
      tags: [schema]
      summary: Preview non-destructive technical schema bootstrap
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: Schema plan without CMDBuild changes
        "403":
          description: CSRF check failed
  /cmdbuild/custom-api/schema/bootstrap:
    post:
      tags: [schema]
      summary: Create missing technical schema objects without destructive updates
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: Bootstrap completed
        "403":
          description: CSRF or admin privilege check failed
  /cmdbuild/custom-api/config:
    get:
      tags: [config]
      summary: Runtime configuration
      responses:
        "200":
          description: Config card data
    put:
      tags: [config]
      summary: Upsert runtime configuration
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Config saved
  /cmdbuild/custom-api/assistant/object-flow/plan:
    post:
      tags: [assistant]
      summary: Propose a complete deterministic object flow
      description: >
        LLM authoring-предложение полного потока Selection -> Match ->
        Selection. Ответ не меняет текущий spec и применяется явно через
        `/draft/object-flow/apply`. Нужны читаемый сохранённый шаблон и
        compare-and-swap base hash, но не update permission.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantObjectFlowPlanRequest"
      responses:
        "200":
          description: Typed complete object-flow proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantObjectFlowPlanResponse"
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Saved template changed before proposal generation
        "422":
          description: Assistant proposal failed deterministic object-flow validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantObjectFlowPlanResponse"
        "429":
          description: Authoring execution throttle reached
        "503":
          description: Assistant is disabled or LiteLLM is not configured
  /cmdbuild/custom-api/draft/object-flow/apply:
    post:
      tags: [templates]
      summary: Apply a reviewed object flow to the editor draft
      description: >
        Детерминированно валидирует и компилирует проверенные selection/match
        stages в новый editor spec. Endpoint не вызывает LLM, не сохраняет и не
        публикует шаблон, не создаёт версию CMDB и не инвалидирует runtime/static
        cache. Нужны читаемый шаблон и совпадающий CAS base hash, но не update
        permission. Каждая selection и intermediate match stage возвращается как
        допустимый источник Diagram mapping.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectFlowApplyRequest"
      responses:
        "200":
          description: Validated editor spec and mapping-source list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectFlowApplyResponse"
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Editor draft or saved template changed before apply
        "422":
          description: Reviewed flow failed deterministic validation or compilation
  /cmdbuild/custom-api/mcp:
    post:
      tags: [mcp]
      summary: Read-only CMDBuild MCP JSON-RPC endpoint
      description: >
        Authoring-only Model Context Protocol adapter for the current CMDBuild
        session. It exposes a narrow read-only tool allowlist controlled by
        RuntimeConfigJson.assistant.mcp. Runtime template execution, endpoint
        cache and static snapshots do not call this endpoint.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
            examples:
              toolsList:
                summary: List allowed tools
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
              callModelSummary:
                summary: Read visible CMDBuild model summary
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: cmdbuild_model_summary
                    arguments:
                      maxClasses: 30
                      maxDomains: 30
      responses:
        "200":
          description: JSON-RPC result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "400":
          description: JSON-RPC protocol or tool error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "403":
          description: CSRF or same-origin check failed
  /cmdbuild/custom-api/templates:
    get:
      tags: [templates]
      summary: List query templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
    post:
      tags: [templates]
      summary: Create query template
      description: >
        Обычное глобальное `Сохранить` для нового шаблона. Требует create
        permission, сохраняет canonical `spec.authoring` вместе с executable
        Spec и записывает версию CMDB. Хранилище принимает неполное authoring.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Template created
  /cmdbuild/custom-api/templates/{code}:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [templates]
      summary: Get one template
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "404":
          description: Template not found
    put:
      tags: [templates]
      summary: Update one template
      description: >
        Обычное глобальное `Сохранить` для существующего шаблона. Требует update
        permission и является единственной update-операцией, записывающей версию
        CMDB template. Хранилище принимает неполный `spec.authoring`; runtime и
        preview проходят строгую execution-валидацию. Runtime cache и static
        snapshots инвалидируются только при изменении executable Spec hash.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "403":
          description: Нет Template update permission или не пройдена CSRF-проверка
        "409":
          description: Template changed since the caller loaded it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionConflict"
    delete:
      tags: [templates]
      summary: Delete one template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Template deleted
  /cmdbuild/custom-api/templates/{code}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [templates]
      summary: Template versions
      responses:
        "200":
          description: Version list
  /cmdbuild/custom-api/templates/{code}/validate:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [templates]
      summary: Validate saved template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Validation result
  /cmdbuild/custom-api/templates/{code}/preview:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [templates]
      summary: Preview saved template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Preview result
  /cmdbuild/custom-api/templates/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [runtime]
      summary: Read-only runtime execution
      description: Used by Runtime UI/iframe; no CSRF required. Runtime execution is not stored in CMDBuild technical classes; events go through standard backend logging. Empty authorized results are returned as HTTP 200 with empty rows and `emptyText`. An explicit CMDBuild 401/403 on a class or attribute used by the template is returned as HTTP 403 with `permissionDenied=true`; the runtime does not return a partial multi-selection result in that case. If CMDBuild masks permission denial as 404, the current implementation may classify it as a generic execution error.
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: noCache
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: json
          in: query
          description: Reserved runtime output flag. When true/1/yes, returns the final runtime result as application/json instead of the normal API envelope used by the HTML runtime shell.
          schema:
            type: string
            enum: ["true", "1", "yes"]
      responses:
        "200":
          description: Runtime result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePermissionDenied"
    post:
      tags: [runtime]
      summary: Direct runtime execution
      description: Designer/API POST may request `forceRefresh` to rebuild the runtime cache without the user refresh cooldown. GET runtime does not accept forced refresh.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: forceRefresh
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Runtime result
  /cmdbuild/custom-api/templates/{code}/publish:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [runtime]
      summary: Publish static snapshot to Redis
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Snapshot published
  /cmdbuild/custom-api/public-snapshots/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [runtime]
      security: []
      summary: Run public static snapshot
      responses:
        "200":
          description: Snapshot result or missing snapshot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
  /cmdbuild/custom-api/draft/validate:
    post:
      tags: [templates]
      summary: Validate unsaved draft
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPayload"
      responses:
        "200":
          description: Validation result
  /cmdbuild/custom-api/draft/diagram-import/analyze:
    post:
      tags: [assistant]
      summary: Analyze a self-contained D2 structure template
      description: >
        Read-only deterministic parser stage Assistant-owned D2 import workflow.
        Требует валидную CMDBuild session и CSRF protection, возвращает structural
        IR, rendered preview и signed review proposal, но не меняет и не
        сохраняет шаблон. Обычное Save или publication проверяет write permission;
        сам analysis его не требует.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportAnalyzeRequest"
      responses:
        "200":
          description: Structural IR and merge proposal
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: CSRF validation failed
        "413":
          description: Configured source, output, or element limit reached
        "429":
          description: D2 analysis execution throttle reached
        "422":
          description: D2 parse, compile, or import validation failed
  /cmdbuild/custom-api/draft/diagram-import/apply:
    post:
      tags: [templates]
      summary: Apply reviewed D2 class-role mappings to an editor draft
      description: >
        Diagram-owned deterministic apply stage. Принимает только явно
        проверенные role settings и selection mappings, возвращает новый
        валидный local draft Spec JSON и не вызывает LLM, не сохраняет и не
        публикует шаблон, не создаёт версию CMDB и не инвалидирует runtime/static
        cache. D2 Update использует тот же local contract. Нужны читаемый
        шаблон и совпадающая CAS revision из proposal, но не update permission.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagramImportApplyRequest"
      responses:
        "200":
          description: Validated editor Spec JSON
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Editor draft, saved template, source, or signed proposal changed after D2 analysis
        "429":
          description: Authoring execution throttle reached
        "422":
          description: Role mappings or relation rules are unresolved, or the result spec is invalid
  /cmdbuild/custom-api/assistant/diagram-import/interpret:
    post:
      tags: [assistant]
      summary: Propose semantic interpretation of imported D2 roles
      description: >
        Authoring-only LLM proposal over a signed D2 import review context. Raw
        D2 source, structural IR, and signed proposal internals are not forwarded
        to the model. The response contains role semantics only and never changes
        Diagram settings or the editor spec.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDiagramImportInterpretRequest"
      responses:
        "200":
          description: Semantic role proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportInterpretResponse"
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Saved template, source, or signed proposal changed after D2 analysis
        "429":
          description: Authoring execution throttle reached
        "422":
          description: Assistant semantic proposal failed deterministic validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportInterpretResponse"
        "503":
          description: Assistant is disabled or LiteLLM is not configured
  /cmdbuild/custom-api/assistant/diagram-import/map-selections:
    post:
      tags: [assistant]
      summary: Propose object-flow sources for imported D2 roles
      description: >
        Authoring-only LLM proposal. Eligible sources include every object-flow
        selection and every intermediate match stage. Returned mappings remain
        proposals until the editor reviews them and explicitly applies the
        deterministic settings in the Diagram-owned draft.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDiagramImportMapSelectionsRequest"
      responses:
        "200":
          description: Selection-to-role mapping proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportMapSelectionsResponse"
        "401":
          description: CMDBuild session is invalid or expired
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Editor flow, saved template, source, or signed proposal changed
        "429":
          description: Authoring execution throttle reached
        "422":
          description: Assistant mapping proposal failed deterministic validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDiagramImportMapSelectionsResponse"
        "503":
          description: Assistant is disabled or LiteLLM is not configured
  /cmdbuild/custom-api/draft/preview:
    post:
      tags: [templates]
      summary: Preview unsaved draft
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPayload"
      responses:
        "200":
          description: Preview result
components:
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
    csrfHeader:
      type: apiKey
      in: header
      name: X-CMDBDynamicPages-CSRF
  parameters:
    TemplateCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ClassName:
      name: className
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 100
    Start:
      name: start
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  requestBodies:
    RunParams:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              params:
                type: object
                additionalProperties: true
              refresh:
                type: boolean
              noCache:
                type: boolean
              forceRefresh:
                type: boolean
              bypassRefreshCooldown:
                type: boolean
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
      additionalProperties: true
    RuntimeJsonResult:
      type: object
      description: Runtime JSON output for `json=true`. A successful response can contain empty rows when no objects are visible under the current user's CMDBuild permissions.
      properties:
        success:
          type: boolean
        action:
          type: string
          example: run
        snapshotFound:
          type: boolean
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        params:
          type: object
          additionalProperties: true
        tables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
              mode:
                type: string
              columns:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    label:
                      type: string
              rows:
                type: array
                items:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: object
                      properties:
                        values:
                          type: object
                          additionalProperties: true
                        links:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              href:
                                type: string
                              text:
                                type: string
                              value:
                                type: string
                              target:
                                type: string
              emptyText:
                type: string
              truncated:
                type: boolean
        diagrams:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagram"
        emptyText:
          type: string
        cache:
          type: object
          nullable: true
          additionalProperties: true
    RuntimeDiagram:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [topology]
        layout:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              group:
                type: string
              href:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              label:
                type: string
        warnings:
          type: array
          items:
            type: string
        truncated:
          type: boolean
    AssistantObjectFlowPlanRequest:
      type: object
      additionalProperties: false
      required: [templateCode, baseSpecHash, currentSpec, prompt]
      properties:
        root:
          type: string
        templateCode:
          type: string
          description: Code существующего читаемого шаблона для local authoring CAS.
        baseSpecHash:
          type: string
          description: Hash сохранённого шаблона для optimistic authoring conflict detection; не означает update permission.
        currentSpec:
          type: object
          additionalProperties: true
        prompt:
          type: string
          minLength: 1
          description: Full author-provided data-flow intent, including selections and joins.
    AssistantObjectFlowPlanResponse:
      type: object
      additionalProperties: false
      required: [success, action]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [assistant-object-flow-plan]
        flow:
          $ref: "#/components/schemas/ObjectFlowProposal"
        code:
          type: string
        message:
          type: string
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposalError"
        diagnostics:
          type: object
          additionalProperties: true
    AssistantProposalError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
        message:
          type: string
    ObjectFlowApplyRequest:
      type: object
      additionalProperties: false
      required: [templateCode, baseSpecHash, currentSpec, flow]
      properties:
        root:
          type: string
        templateCode:
          type: string
        baseSpecHash:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        flow:
          $ref: "#/components/schemas/ObjectFlowProposal"
    ObjectFlowApplyResponse:
      type: object
      additionalProperties: false
      required: [success, action, spec, specHash]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [object-flow-apply]
        spec:
          type: object
          additionalProperties: true
        specHash:
          type: string
        executionSpecHash:
          type: string
          description: Hash executable-части возвращённого draft; authoring-only изменения его не меняют.
    ObjectFlowProposal:
      type: object
      additionalProperties: false
      required: [version, selections, operations]
      properties:
        version:
          type: integer
          enum: [1]
        selections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectFlowSelectionStage"
        operations:
          type: array
          description: Ordered match and set operations. Every source alias must be materialized by a selection or an earlier operation.
          items:
            $ref: "#/components/schemas/ObjectFlowOperation"
        publishedAlias:
          type: string
          description: Optional materialized alias selected for the published result table.
        blocks:
          type: array
          description: Compatibility projection of match operations returned by the server.
          items:
            $ref: "#/components/schemas/ObjectFlowMatchStage"
        setOperations:
          type: array
          description: Compatibility projection of set operations returned by the server.
          items:
            $ref: "#/components/schemas/ObjectFlowSetOperation"
    ObjectFlowSourceRef:
      type: object
      additionalProperties: false
      required: [id, kind, alias]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [selection, match, set]
        alias:
          type: string
        className:
          type: string
        columns:
          type: array
          items:
            type: string
    ObjectFlowSelectionStage:
      type: object
      additionalProperties: false
      required: [id, name, alias, className, limit, columns, rules]
      properties:
        id:
          type: string
        name:
          type: string
        alias:
          type: string
        className:
          type: string
          description: Permission-filtered CMDBuild catalog class selected by the author or proposal.
        from:
          type: string
          description: Optional prior selection or match alias used by correlated filters.
        limit:
          type: integer
          minimum: 1
        columns:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ObjectFlowSelectionRule"
    ObjectFlowSelectionRule:
      type: object
      additionalProperties: false
      required: [action, path, negate, op]
      properties:
        action:
          type: string
          enum: [include, exclude]
        path:
          type: string
        negate:
          type: boolean
        op:
          type: string
          enum: [exists, notExists, matches, notMatches, equals, notEquals, in, contains, startsWith, endsWith, isIpv4, isIpv4Network, ipv4InCidr, ipv4InRange, ipv4CidrOverlaps, ipv4CidrContains]
        regex:
          type: string
        value:
          type: string
        valueParam:
          type: string
        valueColumn:
          type: string
    ObjectFlowMatchStage:
      type: object
      additionalProperties: false
      required: [id, from, with, as, rules]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [match]
        from:
          type: string
          description: Selection or previous intermediate match alias.
        with:
          type: string
          description: Selection alias joined into this stage.
        as:
          type: string
          description: Stable output alias; this output is also a Diagram mapping source.
        rightPrefix:
          type: string
        rules:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectFlowMatchRule"
    ObjectFlowSetOperation:
      type: object
      additionalProperties: false
      required: [id, type, from, with, as, on, distinct, caseSensitive]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [union, difference, intersect]
        from:
          type: string
        with:
          type: string
        as:
          type: string
        on:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [left, right]
            properties:
              left:
                type: string
              right:
                type: string
        distinct:
          type: boolean
        caseSensitive:
          type: boolean
    ObjectFlowOperation:
      oneOf:
        - $ref: "#/components/schemas/ObjectFlowMatchStage"
        - $ref: "#/components/schemas/ObjectFlowSetOperation"
    ObjectFlowMatchRule:
      type: object
      additionalProperties: false
      required: [action, negate, operator, leftColumn, rightColumn]
      properties:
        action:
          type: string
          enum: [include, exclude]
        negate:
          type: boolean
        operator:
          type: string
          enum: [equals, notEquals, contains, regexMatch, ipv4InCidr, ipv4InRange, ipv4CidrOverlaps, ipv4CidrContains]
        leftColumn:
          type: string
        leftRegex:
          type: string
        rightColumn:
          type: string
        rightRegex:
          type: string
    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
    McpJsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
    RuntimePermissionDenied:
      type: object
      description: Returned when a class or attribute actually used by the runtime template is denied by CMDBuild as 401/403. The endpoint does not return partial data from other selections in this case.
      properties:
        success:
          type: boolean
          example: false
        action:
          type: string
          example: run
        permissionDenied:
          type: boolean
          example: true
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        message:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
        permissionDeniedText:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
    SchemaBootstrapRequest:
      type: object
      properties:
        root:
          type: string
          example: Cst_QueryTool
        description:
          type: string
          example: CMDB Dynamic Pages technical root
        parent:
          type: string
          description: CMDBuild superclass under which the technical root class is created.
          example: Class
        confirm:
          type: boolean
          description: UI confirmation that bootstrap may create only missing classes/attributes and must not move/delete existing objects.
    LiveHealth:
      type: object
      required: [service, status, live]
      properties:
        service:
          type: string
          example: cmdbdynamicpages
        timestamp:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        uptimeSec:
          type: integer
        pid:
          type: integer
        status:
          type: string
          example: live
        live:
          type: boolean
    RedisStatus:
      type: object
      properties:
        required:
          type: boolean
        ok:
          type: boolean
        status:
          type: string
        enabled:
          type: boolean
        backend:
          type: string
          enum: [redis, memory]
        available:
          type: boolean
        url:
          type: string
          description: Redis URL with credentials masked.
        keyPrefix:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        error:
          type: string
    RedisHealth:
      allOf:
        - $ref: "#/components/schemas/LiveHealth"
        - type: object
          properties:
            redis:
              $ref: "#/components/schemas/RedisStatus"
    ReadyHealth:
      allOf:
        - $ref: "#/components/schemas/LiveHealth"
        - type: object
          properties:
            ready:
              type: boolean
            checks:
              type: object
              properties:
                process:
                  type: object
                  properties:
                    ok:
                      type: boolean
                    status:
                      type: string
                redis:
                  $ref: "#/components/schemas/RedisStatus"
                cmdbuild:
                  type: object
                  properties:
                    required:
                      type: boolean
                    ok:
                      type: boolean
                    status:
                      type: string
                    url:
                      type: string
                    latencyMs:
                      type: integer
                    statusCode:
                      type: integer
                    error:
                      type: string
    CacheStatus:
      type: object
      properties:
        success:
          type: boolean
        redis:
          $ref: "#/components/schemas/RedisStatus"
        memory:
          type: object
          properties:
            runtimeEntries:
              type: integer
            staticSnapshotEntries:
              type: integer
            inFlightRuntimeBuilds:
              type: integer
    LoggingStatus:
      type: object
      properties:
        success:
          type: boolean
        logging:
          type: object
          properties:
            level:
              type: string
              enum: [debug, info, warn, error, silent]
            format:
              type: string
              enum: [json, text]
            targets:
              type: array
              items:
                type: string
                enum: [stdout, syslog]
            diagnostic:
              type: object
              properties:
                mode:
                  type: string
                  enum: [off, Basic, Verbose]
                enabled:
                  type: boolean
                levels:
                  type: array
                  items:
                    type: string
                    enum: [Basic, Verbose]
                policy:
                  type: object
                  properties:
                    basic:
                      type: string
                    verbose:
                      type: string
            redactHeaders:
              type: array
              items:
                type: string
            redactQuery:
              type: array
              items:
                type: string
            syslog:
              nullable: true
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                protocol:
                  type: string
                  enum: [udp, tcp]
                facility:
                  type: string
            elk:
              type: object
              properties:
                directOutput:
                  type: boolean
                recommendedPipeline:
                  type: string
    TemplatePayload:
      type: object
      required: [code, spec]
      properties:
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        spec:
          type: object
          description: >
            Template Spec JSON. Normal dynamic templates используют DSL
            steps/result model; special CMDBuild model view templates задают
            `kind=cmdbBuildView` и хранят renderer settings в `cmdbBuildView`.
            Canonical Assistant и D2 authoring находится в `spec.authoring`:
            version, assistant prompts, D2 source и source hash. Хранилище
            принимает неполный authoring section; execution paths валидируют его
            строго.
          additionalProperties: true
        expectedSpecHash:
          type: string
          description: Optional optimistic update guard. If present on update, the backend returns 409 when the stored template spec hash differs.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          additionalProperties: true
        resultSchema:
          type: object
          additionalProperties: true
    TemplateCard:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
          nullable: true
        spec:
          type: object
          additionalProperties: true
        specHash:
          type: string
          description: SHA-256 hash of the normalized template spec used by Designer as expectedSpecHash on update.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          nullable: true
          additionalProperties: true
        resultSchema:
          type: object
          nullable: true
          additionalProperties: true
        owner:
          type: string
        updatedAt:
          type: string
          nullable: true
        protected:
          type: boolean
    TemplateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            root:
              type: string
            className:
              type: string
            template:
              $ref: "#/components/schemas/TemplateCard"
            versionLog:
              nullable: true
              type: object
              additionalProperties: true
            executionValidation:
              type: object
              description: Статус строгой execution-валидации сохранённого Spec. Успешное Save может вернуть неполный неисполняемый authoring draft.
              additionalProperties: true
    TemplateListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            root:
              type: string
            className:
              type: string
            templates:
              type: array
              items:
                $ref: "#/components/schemas/TemplateCard"
    TemplateVersionConflict:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            reason:
              type: string
              enum: [template_version_conflict]
            message:
              type: string
            expectedSpecHash:
              type: string
            currentSpecHash:
              type: string
            template:
              $ref: "#/components/schemas/TemplateCard"
    DraftPayload:
      type: object
      required: [spec]
      properties:
        spec:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true
    DiagramImportAnalyzeRequest:
      type: object
      additionalProperties: false
      required: [templateCode, currentSpec, d2Source]
      properties:
        root:
          type: string
        templateCode:
          type: string
        baseSpecHash:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        d2Source:
          type: string
    DiagramImportApplyRequest:
      type: object
      additionalProperties: false
      required: [currentSpec, proposal]
      properties:
        root:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        proposal:
          type: object
          additionalProperties: true
        roles:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRoleOverride"
        relationRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRelationRule"
        placementRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportPlacementRule"
    AssistantDiagramImportInterpretRequest:
      type: object
      additionalProperties: false
      required: [currentSpec, proposal, roles, prompt]
      properties:
        root:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        proposal:
          $ref: "#/components/schemas/DiagramImportProposalEnvelope"
        prompt:
          type: string
          minLength: 1
          description: Author guidance for semantic interpretation; no customer-specific default is part of the API contract.
        roles:
          type: array
          description: Imported roles visible to semantic interpretation.
          items:
            $ref: "#/components/schemas/DiagramImportRoleOverride"
        relationRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRelationRule"
        placementRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportPlacementRule"
    AssistantDiagramImportInterpretResponse:
      type: object
      additionalProperties: false
      required: [success, action]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [assistant-diagram-import-interpret]
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportSemanticProposal"
        code:
          type: string
        message:
          type: string
        unresolvedRoleIds:
          type: array
          items:
            type: string
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposalError"
        diagnostics:
          type: object
          additionalProperties: true
    AssistantDiagramImportMapSelectionsRequest:
      type: object
      additionalProperties: false
      required: [currentSpec, proposal, roles, prompt]
      properties:
        root:
          type: string
        currentSpec:
          type: object
          additionalProperties: true
        proposal:
          $ref: "#/components/schemas/DiagramImportProposalEnvelope"
        prompt:
          type: string
          minLength: 1
          description: Author guidance for selection-to-role mapping.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRoleOverride"
        relationRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportRelationRule"
        placementRules:
          type: array
          items:
            $ref: "#/components/schemas/DiagramImportPlacementRule"
        stages:
          type: array
          description: Optional client summary; the backend derives and validates the authoritative stages from currentSpec.
          items:
            $ref: "#/components/schemas/ObjectFlowSourceRef"
    AssistantDiagramImportMapSelectionsResponse:
      type: object
      additionalProperties: false
      required: [success, action]
      properties:
        success:
          type: boolean
        action:
          type: string
          enum: [assistant-diagram-import-map-selections]
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/DiagramSelectionMapping"
        code:
          type: string
        message:
          type: string
        unresolvedRoleIds:
          type: array
          items:
            type: string
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/AssistantProposalError"
        diagnostics:
          type: object
          additionalProperties: true
    DiagramImportProposalEnvelope:
      type: object
      description: Signed immutable class-aware IR v3 proposal produced by deterministic D2 analysis.
      required: [version, proposalId, templateCode, baseSpecHash, editorSpecHash, signature]
      additionalProperties: true
      properties:
        version:
          type: integer
          enum: [3]
        proposalId:
          type: string
        templateCode:
          type: string
        baseSpecHash:
          type: string
        editorSpecHash:
          type: string
        createdAt:
          type: integer
          format: int64
        signature:
          type: string
    DiagramImportRoleContext:
      type: object
      additionalProperties: false
      required: [id, key]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          type: string
        kind:
          type: string
        selectedSemantic:
          type: string
          nullable: true
          enum: [object, composite, group, static]
    DiagramImportSemanticProposal:
      type: object
      additionalProperties: false
      required: [roleId, semantic]
      properties:
        roleId:
          type: string
        semantic:
          type: string
          enum: [object, composite, group, static]
        confidence:
          type: string
          enum: [high, medium, low]
        reason:
          type: string
    DiagramSelectionMapping:
      type: object
      additionalProperties: false
      required: [roleId, source, mapping]
      properties:
        roleId:
          type: string
        source:
          $ref: "#/components/schemas/ObjectFlowSourceRef"
        mapping:
          type: object
          additionalProperties: true
        confidence:
          type: string
          enum: [high, medium, low]
        reason:
          type: string
    DiagramImportRoleOverride:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id:
          type: string
        selectedSemantic:
          type: string
          nullable: true
          enum: [object, composite, group, static]
        exemplarKey:
          type: string
        mapping:
          type: object
          description: Explicit primary CMDBuild class plus optional related-class paths and structured fields. Source aliases are backend-managed.
          additionalProperties: true
    DiagramImportRelationHop:
      type: object
      required: [kind, name, targetClass]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [reference, domain]
        name:
          type: string
        domain:
          type: string
          description: CMDBuild domain identifier backing a reference attribute, when exposed by the catalog.
        targetClass:
          type: string
        direction:
          type: string
          enum: [direct, inverse, both]
    DiagramImportRelationRule:
      type: object
      required: [id, kind, parentRoleId, childRoleId, path]
      additionalProperties: false
      properties:
        id:
          type: string
        kind:

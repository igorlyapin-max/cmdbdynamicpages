            type: string
            example: Cst_QueryTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
            examples:
              toolsList:
                summary: Перечислить разрешённые инструменты
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
              callModelSummary:
                summary: Прочитать сводку доступной модели CMDBuild
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: cmdbuild_model_summary
                    arguments:
                      maxClasses: 30
                      maxDomains: 30
      responses:
        "200":
          description: Результат JSON-RPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "400":

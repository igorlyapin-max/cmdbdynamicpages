        right:
          $ref: "#/components/schemas/DiagramImportFilterRightOperand"
    DiagramImportFilterRightOperand:
      type: object
      additionalProperties: true
      required: [kind]
      properties:
        kind:
          type: string
          enum: [literal, param, stage]

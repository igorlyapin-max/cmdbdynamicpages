        idAttribute:
          type: string
        labelTemplate:
          type: string
        structuredFields:
          type: array
          items:
            type: string
        filters:
          type: array
          items:
            type: object
            additionalProperties: true
        cardSource:
          type: object
          additionalProperties: true
    DiagramImportFilterSet:

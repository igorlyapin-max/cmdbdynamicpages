                $ref: "#/components/schemas/TemplateListResponse"
    post:
      x-flow-id: OAPI21
      tags: [templates]
      summary: Создать шаблон запроса
      description: >
        Обычное глобальное `Сохранить` для нового шаблона. Требует create
        permission, сохраняет canonical `spec.authoring` вместе с executable
        Spec и записывает версию CMDB. Хранилище принимает неполное authoring.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Шаблон создан
        "413":
          $ref: "#/components/responses/InputCollectionLimit"
  /cmdbuild/custom-api/templates/{code}:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      x-flow-id: OAPI22
      tags: [templates]
      summary: Получить один шаблон
      responses:
        "200":
          description: Шаблон
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "404":
          description: Шаблон не найден
    put:
      x-flow-id: OAPI23
      tags: [templates]
      summary: Обновить один шаблон
      description: >
        Обычное глобальное `Сохранить` для существующего шаблона. Требует update
        permission и является единственной update-операцией, записывающей версию
        CMDB template. Хранилище принимает неполный `spec.authoring`; runtime и
        preview проходят строгую execution-валидацию. Runtime cache и static
        snapshots инвалидируются при изменении executable Spec hash, кода или
        деактивации. Если изменение отзывает публичный снимок, отзыв в Redis
        подтверждается до записи в CMDB. Явный отказ CMDB (400, 401, 403, 409,
        412, 422) восстанавливает прежнее поколение; неопределённый результат
        оставляет поколение в pending.
        При наличии transferReplace применяется отдельная ветка: проверяются
        identity, revision и права назначения, повторно валидируется итоговый
        нормализованный spec, затем отправляется частичный PUT без Code, Active и Owner.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/TemplateTransferRoot"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Шаблон обновлён
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateMutationResponse"
        "403":
          description: Нет Template update permission или не пройдена CSRF-проверка
        "409":
          description: Шаблон изменился после загрузки или после Prepare замены
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TemplateVersionConflict"
                  - type: object
                    required: [success, code, message]
                    properties:
                      success: { type: boolean, enum: [false] }
                      code: { type: string, enum: [template_transfer_revision_conflict] }
                      message: { type: string }
        "413":
          $ref: "#/components/responses/InputCollectionLimit"
        "422":
          description: Итоговое определение transferReplace не готово к выполнению; шаблон и история не изменены
          content:
            application/json:
              schema:
                type: object
                required: [success, code, message, issues]
                properties:
                  success: { type: boolean, enum: [false] }
                  code: { type: string, enum: [template_transfer_incomplete] }
                  message: { type: string }
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/TemplateTransferIssue"
        "502":
          $ref: "#/components/responses/TemplateMutationFailed"
        "503":
          $ref: "#/components/responses/SnapshotRevocationUnavailable"
    delete:
      x-flow-id: OAPI24
      tags: [templates]
      summary: Удалить один шаблон
      description: Удаление использует те же правила подтверждения и восстановления отзыва, что PUT.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Шаблон удалён
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateMutationResponse"
        "403":
          description: Не подтверждено право удаления шаблона или не пройдена CSRF-проверка
        "502":
          $ref: "#/components/responses/TemplateMutationFailed"
        "503":
          $ref: "#/components/responses/SnapshotRevocationUnavailable"
  /cmdbuild/custom-api/templates/{code}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      x-flow-id: OAPI25
      tags: [templates]
      summary: Версии шаблона
      responses:
        "200":
          description: Список версий
  /cmdbuild/custom-api/templates/{code}/validate:
    parameters:

openapi: 3.0.3
info:
  title: cmdbdynamicpages API
  version: 0.1.0
  description: >
    Backend-owned UI/API for CMDBuild dynamic pages. Dynamic endpoints run with
    the current CMDBuild session cookie. Health endpoints are unauthenticated.
servers:
  - url: http://127.0.0.1:8093
    description: Local dynamicpages backend
  - url: http://localhost:8088
    description: Local same-origin nginx front
tags:
  - name: health
  - name: diagnostics
  - name: session
  - name: model
  - name: schema
  - name: templates
  - name: runtime
  - name: assistant
  - name: mcp
  - name: config
security:
  - cmdbuildCookie: []
paths:
  /health/live:
    get:
      tags: [health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Backend process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/redis:
    get:
      tags: [health]
      security: []
      summary: Strict Redis health probe
      responses:
        "200":
          description: Redis is available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedisHealth"
        "503":
          description: Redis is unavailable or disabled
  /health/ready:
    get:
      tags: [health]
      security: []
      summary: Production readiness probe
      responses:
        "200":
          description: Backend is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend is not ready
  /metrics:
    get:
      tags: [health]
      security: []
      summary: Prometheus metrics
      description: Returns aggregate operational counters and gauges only; cookies, tokens, user names, runtime rows, and raw CMDBuild payloads are not exposed.
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
                example: |
                  # HELP cmdp_health_ready Readiness status: 1 ready, 0 not ready.
                  # TYPE cmdp_health_ready gauge
                  cmdp_health_ready 1
        "500":
          description: Metrics rendering failed
  /cmdbuild/custom-api/cache/status:
    get:
      tags: [diagnostics]
      security: []
      summary: Diagnostic cache status
      description: Returns 200 even when Redis fallback to memory is active; do not use as strict readiness.
      responses:
        "200":
          description: Cache diagnostic status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatus"
  /cmdbuild/custom-api/logging/status:
    get:
      tags: [diagnostics]
      summary: Diagnostic logging configuration
      description: Returns active log level, target and redaction settings without secrets. This is not readiness.
      responses:
        "200":
          description: Logging diagnostic status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggingStatus"
        "401":
          description: CMDBuild session cookie is missing or invalid
  /cmdbuild/custom-api/session:
    get:
      tags: [session]
      summary: Current CMDBuild session
      responses:
        "200":
          description: Sanitized session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: CMDBuild session cookie is missing or invalid
  /cmdbuild/custom-api/model/catalog:
    get:
      tags: [model]
      summary: Current-user visible model catalog
      responses:
        "200":
          description: Classes, attributes, domains, lookups visible to current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes:
    get:
      tags: [model]
      summary: Visible CMDBuild classes
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Start"
      responses:
        "200":
          description: Class list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes/{className}:
    get:
      tags: [model]
      summary: One CMDBuild class metadata
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Class metadata
        "403":
          description: Access denied
        "404":
          description: Class not found
  /cmdbuild/custom-api/model/classes/{className}/attributes:
    get:
      tags: [model]
      summary: Attributes visible for one class
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Attribute list
  /cmdbuild/custom-api/model/domains:
    get:
      tags: [model]
      summary: Visible CMDBuild domains
      parameters:
        - name: detailed
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Domain list
  /cmdbuild/custom-api/auth/permission-scope:
    get:
      tags: [model]
      summary: Permission-scope diagnostics
      responses:
        "200":
          description: Diagnostic visible-model hashes and endpoint statuses
  /cmdbuild/custom-api/csrf:
    get:
      tags: [session]
      summary: Get custom API CSRF token
      responses:
        "200":
          description: CSRF token for non-GET calls
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
  /cmdbuild/custom-api/schema:
    get:
      tags: [schema]
      summary: Technical schema readiness
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
        - name: parent
          in: query
          schema:
            type: string
            example: Class
      responses:
        "200":
          description: Technical schema status
  /cmdbuild/custom-api/schema/parents:
    get:
      tags: [schema]
      summary: Candidate parent superclasses for technical schema
      responses:
        "200":
          description: Parent class list
  /cmdbuild/custom-api/schema/preview:
    post:
      tags: [schema]
      summary: Preview non-destructive technical schema bootstrap
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: Schema plan without CMDBuild changes
        "403":
          description: CSRF check failed
  /cmdbuild/custom-api/schema/bootstrap:
    post:
      tags: [schema]
      summary: Create missing technical schema objects without destructive updates
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: Bootstrap completed
        "403":
          description: CSRF or admin privilege check failed
  /cmdbuild/custom-api/config:
    get:
      tags: [config]
      summary: Runtime configuration
      responses:
        "200":
          description: Config card data
    put:
      tags: [config]
      summary: Upsert runtime configuration
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Config saved
  /cmdbuild/custom-api/assistant/template-draft:
    post:
      tags: [assistant]
      summary: Generate deterministic template draft through LiteLLM
      description: Authoring-only endpoint. The returned spec is validated by the same runtime DSL validator; runtime execution, cache and static snapshots do not call LLM.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantDraftRequest"
      responses:
        "200":
          description: Valid template draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDraftResponse"
        "422":
          description: Assistant returned a syntactically parsed draft that failed DSL validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantDraftResponse"
        "503":
          description: Assistant is disabled or LiteLLM is not configured
  /cmdbuild/custom-api/mcp:
    post:
      tags: [mcp]
      summary: Read-only CMDBuild MCP JSON-RPC endpoint
      description: >
        Authoring-only Model Context Protocol adapter for the current CMDBuild
        session. It exposes a narrow read-only tool allowlist controlled by
        RuntimeConfigJson.assistant.mcp. Runtime template execution, endpoint
        cache and static snapshots do not call this endpoint.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
            examples:
              toolsList:
                summary: List allowed tools
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
              callModelSummary:
                summary: Read visible CMDBuild model summary
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: cmdbuild_model_summary
                    arguments:
                      maxClasses: 30
                      maxDomains: 30
      responses:
        "200":
          description: JSON-RPC result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "400":
          description: JSON-RPC protocol or tool error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "403":
          description: CSRF or same-origin check failed
  /cmdbuild/custom-api/templates:
    get:
      tags: [templates]
      summary: List query templates
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateListResponse"
    post:
      tags: [templates]
      summary: Create query template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Template created
  /cmdbuild/custom-api/templates/{code}:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [templates]
      summary: Get one template
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "404":
          description: Template not found
    put:
      tags: [templates]
      summary: Update one template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePayload"
      responses:
        "200":
          description: Template updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"
        "409":
          description: Template changed since the caller loaded it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateVersionConflict"
    delete:
      tags: [templates]
      summary: Delete one template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Template deleted
  /cmdbuild/custom-api/templates/{code}/versions:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [templates]
      summary: Template versions
      responses:
        "200":
          description: Version list
  /cmdbuild/custom-api/templates/{code}/validate:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [templates]
      summary: Validate saved template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      responses:
        "200":
          description: Validation result
  /cmdbuild/custom-api/templates/{code}/preview:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [templates]
      summary: Preview saved template
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Preview result
  /cmdbuild/custom-api/templates/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [runtime]
      summary: Read-only runtime execution
      description: Used by Runtime UI/iframe; no CSRF required. Runtime execution is not stored in CMDBuild technical classes; events go through standard backend logging. Empty authorized results are returned as HTTP 200 with empty rows and `emptyText`. An explicit CMDBuild 401/403 on a class or attribute used by the template is returned as HTTP 403 with `permissionDenied=true`; the runtime does not return a partial multi-selection result in that case. If CMDBuild masks permission denial as 404, the current implementation may classify it as a generic execution error.
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: noCache
          in: query
          schema:
            type: string
            enum: ["1"]
        - name: json
          in: query
          description: Reserved runtime output flag. When true/1/yes, returns the final runtime result as application/json instead of the normal API envelope used by the HTML runtime shell.
          schema:
            type: string
            enum: ["true", "1", "yes"]
      responses:
        "200":
          description: Runtime result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
        "403":
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePermissionDenied"
    post:
      tags: [runtime]
      summary: Direct runtime execution
      description: Designer/API POST may request `forceRefresh` to rebuild the runtime cache without the user refresh cooldown. GET runtime does not accept forced refresh.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: forceRefresh
          in: query
          schema:
            type: string
            enum: ["1"]
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Runtime result
  /cmdbuild/custom-api/templates/{code}/publish:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    post:
      tags: [runtime]
      summary: Publish static snapshot to Redis
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        $ref: "#/components/requestBodies/RunParams"
      responses:
        "200":
          description: Snapshot published
  /cmdbuild/custom-api/public-snapshots/{code}/run:
    parameters:
      - $ref: "#/components/parameters/TemplateCode"
    get:
      tags: [runtime]
      security: []
      summary: Run public static snapshot
      responses:
        "200":
          description: Snapshot result or missing snapshot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeJsonResult"
  /cmdbuild/custom-api/draft/validate:
    post:
      tags: [templates]
      summary: Validate unsaved draft
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPayload"
      responses:
        "200":
          description: Validation result
  /cmdbuild/custom-api/draft/preview:
    post:
      tags: [templates]
      summary: Preview unsaved draft
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftPayload"
      responses:
        "200":
          description: Preview result
components:
  securitySchemes:
    cmdbuildCookie:
      type: apiKey
      in: cookie
      name: CMDBuild-Authorization
    csrfHeader:
      type: apiKey
      in: header
      name: X-CMDBDynamicPages-CSRF
  parameters:
    TemplateCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ClassName:
      name: className
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 0
        default: 100
    Start:
      name: start
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  requestBodies:
    RunParams:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              params:
                type: object
                additionalProperties: true
              refresh:
                type: boolean
              noCache:
                type: boolean
              forceRefresh:
                type: boolean
              bypassRefreshCooldown:
                type: boolean
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
      additionalProperties: true
    RuntimeJsonResult:
      type: object
      description: Runtime JSON output for `json=true`. A successful response can contain empty rows when no objects are visible under the current user's CMDBuild permissions.
      properties:
        success:
          type: boolean
        action:
          type: string
          example: run
        snapshotFound:
          type: boolean
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        params:
          type: object
          additionalProperties: true
        tables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type: string
              mode:
                type: string
              columns:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    label:
                      type: string
              rows:
                type: array
                items:
                  oneOf:
                    - type: object
                      additionalProperties: true
                    - type: object
                      properties:
                        values:
                          type: object
                          additionalProperties: true
                        links:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              href:
                                type: string
                              text:
                                type: string
                              value:
                                type: string
                              target:
                                type: string
              emptyText:
                type: string
              truncated:
                type: boolean
        diagrams:
          type: array
          items:
            $ref: "#/components/schemas/RuntimeDiagram"
        emptyText:
          type: string
        cache:
          type: object
          nullable: true
          additionalProperties: true
    RuntimeDiagram:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [topology]
        layout:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              label:
                type: string
              group:
                type: string
              href:
                type: string
        edges:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              target:
                type: string
              label:
                type: string
        warnings:
          type: array
          items:
            type: string
        truncated:
          type: boolean
    AssistantDraftRequest:
      type: object
      required: [intent]
      properties:
        root:
          type: string
          example: Cst_QueryTool
        intent:
          type: string
        taskMode:
          type: string
          enum: [tables, diagrams, both]
          default: both
        currentSpec:
          type: object
          additionalProperties: true
    AssistantDraftResponse:
      type: object
      properties:
        success:
          type: boolean
        action:
          type: string
          example: assistant-template-draft
        spec:
          type: object
          additionalProperties: true
        explanation:
          type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        assistant:
          type: object
          additionalProperties: true
        mcpContext:
          type: object
          properties:
            enabled:
              type: boolean
            tools:
              type: array
              items:
                type: string
            truncated:
              type: boolean
    McpJsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        method:
          type: string
          enum: [initialize, tools/list, tools/call]
        params:
          type: object
          additionalProperties: true
    McpJsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              additionalProperties: true
    RuntimePermissionDenied:
      type: object
      description: Returned when a class or attribute actually used by the runtime template is denied by CMDBuild as 401/403. The endpoint does not return partial data from other selections in this case.
      properties:
        success:
          type: boolean
          example: false
        action:
          type: string
          example: run
        permissionDenied:
          type: boolean
          example: true
        template:
          type: object
          properties:
            code:
              type: string
            description:
              type: string
            active:
              type: boolean
        message:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
        permissionDeniedText:
          type: string
          example: Вам не хватает прав увидеть данные или интерфейс дизайнера
    SchemaBootstrapRequest:
      type: object
      properties:
        root:
          type: string
          example: Cst_QueryTool
        description:
          type: string
          example: CMDB Dynamic Pages technical root
        parent:
          type: string
          description: CMDBuild superclass under which the technical root class is created.
          example: Class
        confirm:
          type: boolean
          description: UI confirmation that bootstrap may create only missing classes/attributes and must not move/delete existing objects.
    LiveHealth:
      type: object
      required: [service, status, live]
      properties:
        service:
          type: string
          example: cmdbdynamicpages
        timestamp:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        uptimeSec:
          type: integer
        pid:
          type: integer
        status:
          type: string
          example: live
        live:
          type: boolean
    RedisStatus:
      type: object
      properties:
        required:
          type: boolean
        ok:
          type: boolean
        status:
          type: string
        enabled:
          type: boolean
        backend:
          type: string
          enum: [redis, memory]
        available:
          type: boolean
        url:
          type: string
          description: Redis URL with credentials masked.
        keyPrefix:
          type: string
        lastCheckedAt:
          type: string
          format: date-time
        error:
          type: string
    RedisHealth:
      allOf:
        - $ref: "#/components/schemas/LiveHealth"
        - type: object
          properties:
            redis:
              $ref: "#/components/schemas/RedisStatus"
    ReadyHealth:
      allOf:
        - $ref: "#/components/schemas/LiveHealth"
        - type: object
          properties:
            ready:
              type: boolean
            checks:
              type: object
              properties:
                process:
                  type: object
                  properties:
                    ok:
                      type: boolean
                    status:
                      type: string
                redis:
                  $ref: "#/components/schemas/RedisStatus"
                cmdbuild:
                  type: object
                  properties:
                    required:
                      type: boolean
                    ok:
                      type: boolean
                    status:
                      type: string
                    url:
                      type: string
                    latencyMs:
                      type: integer
                    statusCode:
                      type: integer
                    error:
                      type: string
    CacheStatus:
      type: object
      properties:
        success:
          type: boolean
        redis:
          $ref: "#/components/schemas/RedisStatus"
        memory:
          type: object
          properties:
            runtimeEntries:
              type: integer
            staticSnapshotEntries:
              type: integer
            inFlightRuntimeBuilds:
              type: integer
    LoggingStatus:
      type: object
      properties:
        success:
          type: boolean
        logging:
          type: object
          properties:
            level:
              type: string
              enum: [debug, info, warn, error, silent]
            format:
              type: string
              enum: [json, text]
            targets:
              type: array
              items:
                type: string
                enum: [stdout, syslog]
            diagnostic:
              type: object
              properties:
                mode:
                  type: string
                  enum: [off, Basic, Verbose]
                enabled:
                  type: boolean
                levels:
                  type: array
                  items:
                    type: string
                    enum: [Basic, Verbose]
                policy:
                  type: object
                  properties:
                    basic:
                      type: string
                    verbose:
                      type: string
            redactHeaders:
              type: array
              items:
                type: string
            redactQuery:
              type: array
              items:
                type: string
            syslog:
              nullable: true
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                protocol:
                  type: string
                  enum: [udp, tcp]
                facility:
                  type: string
            elk:
              type: object
              properties:
                directOutput:
                  type: boolean
                recommendedPipeline:
                  type: string
    TemplatePayload:
      type: object
      required: [code, spec]
      properties:
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
        spec:
          type: object
          description: Template Spec JSON. Normal dynamic templates use the DSL steps/result model; special CMDBuild model view templates set `kind=cmdbBuildView` and store renderer settings under `cmdbBuildView`.
          additionalProperties: true
        expectedSpecHash:
          type: string
          description: Optional optimistic update guard. If present on update, the backend returns 409 when the stored template spec hash differs.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          additionalProperties: true
        resultSchema:
          type: object
          additionalProperties: true
    TemplateCard:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        code:
          type: string
        description:
          type: string
        active:
          type: boolean
          nullable: true
        spec:
          type: object
          additionalProperties: true
        specHash:
          type: string
          description: SHA-256 hash of the normalized template spec used by Designer as expectedSpecHash on update.
          pattern: "^[a-f0-9]{64}$"
        paramsSchema:
          type: object
          nullable: true
          additionalProperties: true
        resultSchema:
          type: object
          nullable: true
          additionalProperties: true
        owner:
          type: string
        updatedAt:
          type: string
          nullable: true
        protected:
          type: boolean
    TemplateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            root:
              type: string
            className:
              type: string
            template:
              $ref: "#/components/schemas/TemplateCard"
            versionLog:
              nullable: true
              type: object
              additionalProperties: true
    TemplateListResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            root:
              type: string
            className:
              type: string
            templates:
              type: array
              items:
                $ref: "#/components/schemas/TemplateCard"
    TemplateVersionConflict:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            reason:
              type: string
              enum: [template_version_conflict]
            message:
              type: string
            expectedSpecHash:
              type: string
            currentSpecHash:
              type: string
            template:
              $ref: "#/components/schemas/TemplateCard"
    DraftPayload:
      type: object
      required: [spec]
      properties:
        spec:
          type: object
          additionalProperties: true
        params:
          type: object
          additionalProperties: true

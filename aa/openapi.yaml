openapi: 3.0.3
info:
  title: cmdbdynamicpages API
  version: 0.1.0
  description: >
    HTTP-контракт backend cmdbdynamicpages. Закрытые маршруты принимают только
    cookie CMDBuild-Authorization, не Bearer/header/query token. Проверка
    действительности сессии зависит от обработчика и описана у операции.
    Публичные health, metrics, cache/status и public-snapshots не требуют cookie.
    Операции с csrfHeader дополнительно требуют same-origin Origin либо Referer
    (Origin имеет приоритет); ожидаемый origin задаётся CMDP_PUBLIC_ORIGIN,
    иначе вычисляется из HTTP Host. Отсутствие обоих заголовков даёт 403.
    Неподдержанный метод на маршрутах с methodAllowed даёт 405 и Allow;
    необработанное исключение custom-api даёт 500, остановка сервиса даёт 503.
    Каноническое Assistant/D2 authoring хранится в `spec.authoring`; версию
    шаблона записывает только обычный template POST/PUT.
x-source-evidence:
  - scripts/dev-proxy-server.mjs: handleBackend, handleDynamicPagesUi, backendAuthFromRequest, requireStateChangingRequest
  - scripts/dev-proxy-server.mjs: readinessPayload, d2RendererHealth, d2ImporterHealth
x-contract-scope: >
  Контракт выведен из исходного кода, а не из live-проверки инфраструктуры заказчика.
  Порядок существующих paths сохранён; обычные HTTP operations нумеруются OAPI0
  и далее. H/M/L имеют семантический приоритет; alias health сохраняет H того же
  probe. Удалённые Assistant contracts не поддержаны и не запланированы.
  Прозрачный proxy CMDBuild не является отдельным owned API. Используемое backend
  подмножество внешних REST-вызовов описано в openapi/cmdbuild-consumed.openapi.yaml и
  openapi/litellm-consumed.openapi.yaml.
servers:
  - url: "{protocol}://{host}:{port}"
    description: >
      Placeholder адреса поставки, не сеть заказчика. FQDN, TLS termination,
      protocol и port для каждого контура требуют согласования; defaults
      синтаксические, не подтверждение deployment.
    variables:
      protocol:
        default: https
        enum: [http, https]
      host:
        default: dynamicpages.example.invalid
      port:
        default: "443"
  - url: http://127.0.0.1:8093
    description: Только локальный development backend, HTTP/TCP 8093
  - url: http://localhost:8088
    description: Только локальный development nginx front, HTTP/TCP 8088
tags:
  - name: health
  - name: diagnostics
  - name: session
  - name: model
  - name: schema
  - name: templates
  - name: runtime
  - name: assistant
    description: >
      API authoring-предложений. Assistant формирует object-flow, D2
      interpretation, structure-tree placement и topology предложения; ответы
      не сохраняют шаблон. Legacy `/assistant/template-draft`,
      `/assistant/diagram-import/complete` и
      `/templates/{code}/assistant-draft` не поддержаны и не запланированы;
      последний route возвращает 410.
  - name: mcp
  - name: config
security:
  - cmdbuildCookie: []
paths:
  /health/live:
    get:
      x-flow-id: H0
      tags: [health]
      security: []
      summary: Проверка жизнеспособности
      description: Публичная эксплуатационная проверка. Показывает только жизнеспособность процесса backend, без данных CMDBuild.
      responses:
        "200":
          description: Процесс backend работает
          headers:
            X-CMDP-Version:
              $ref: "#/components/headers/CmdpVersion"
            X-CMDP-Revision:
              $ref: "#/components/headers/CmdpRevision"
            X-CMDP-Provenance:
              $ref: "#/components/headers/CmdpProvenance"
            X-CMDP-Editor-SHA256:
              $ref: "#/components/headers/CmdpEditorSha256"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveHealth"
  /health/redis:
    get:
      x-flow-id: H1
      tags: [health]
      security: []
      summary: Строгая проверка доступности Redis
      description: Публичная эксплуатационная проверка. Показывает доступность Redis без учётных данных и кэшированных бизнес-данных.
      responses:
        "200":
          description: Redis доступен
          headers:
            X-CMDP-Version:
              $ref: "#/components/headers/CmdpVersion"
            X-CMDP-Revision:
              $ref: "#/components/headers/CmdpRevision"
            X-CMDP-Provenance:
              $ref: "#/components/headers/CmdpProvenance"
            X-CMDP-Editor-SHA256:
              $ref: "#/components/headers/CmdpEditorSha256"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedisHealth"
        "503":
          description: Redis недоступен либо выключен
          headers:
            X-CMDP-Version:
              $ref: "#/components/headers/CmdpVersion"
            X-CMDP-Revision:
              $ref: "#/components/headers/CmdpRevision"
            X-CMDP-Provenance:
              $ref: "#/components/headers/CmdpProvenance"
            X-CMDP-Editor-SHA256:
              $ref: "#/components/headers/CmdpEditorSha256"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RedisHealth"
                  - $ref: "#/components/schemas/HealthFailure"
  /health/ready:
    get:
      x-flow-id: H2
      tags: [health]
      security: []
      summary: Проверка готовности к промышленной эксплуатации
      description: >
        Публичная проверка зависимостей. ready = cmdbuild.ok AND
        (NOT HEALTH_REDIS_REQUIRED OR redis.ok) AND (NOT d2.required OR d2.ok)
        AND (NOT d2Import.required OR d2Import.ok). Renderer обязателен при
        CMDP_D2_RENDER_ENABLED; importer обязателен всегда. Оба проверяются локальными
        процессами, не HTTP, с кэшем проверки 15 секунд. Проверка CMDBuild
        без сессии подтверждает доступность HTTP, но не права пользователя.
      responses:
        "200":
          description: Backend готов к работе
          headers:
            X-CMDP-Version:
              $ref: "#/components/headers/CmdpVersion"
            X-CMDP-Revision:
              $ref: "#/components/headers/CmdpRevision"
            X-CMDP-Provenance:
              $ref: "#/components/headers/CmdpProvenance"
            X-CMDP-Editor-SHA256:
              $ref: "#/components/headers/CmdpEditorSha256"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyHealth"
        "503":
          description: Backend не готов к работе
          headers:
            X-CMDP-Version:
              $ref: "#/components/headers/CmdpVersion"
            X-CMDP-Revision:
              $ref: "#/components/headers/CmdpRevision"
            X-CMDP-Provenance:
              $ref: "#/components/headers/CmdpProvenance"
            X-CMDP-Editor-SHA256:
              $ref: "#/components/headers/CmdpEditorSha256"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadyHealth"
                  - $ref: "#/components/schemas/HealthFailure"
  /metrics:
    get:
      x-flow-id: M0
      tags: [health]
      security: []
      summary: Метрики Prometheus
      description: Возвращает только агрегированные эксплуатационные счётчики и текущие значения; cookie, токены, имена пользователей, строки результатов выполнения и исходные данные CMDBuild не раскрываются.
      responses:
        "200":
          description: Текстовый формат экспорта Prometheus
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
                example: |
                  # HELP cmdp_health_ready Readiness status: 1 ready, 0 not ready.
                  # TYPE cmdp_health_ready gauge
                  cmdp_health_ready 1
        "500":
          description: Ошибка формирования метрик
  /cmdbuild/custom-api/cache/status:
    get:
      x-flow-id: OAPI0
      tags: [diagnostics]
      security: []
      summary: Диагностическое состояние кэша
      description: Публичная эксплуатационная диагностика. Возвращает 200 даже при переключении с Redis на кэш в памяти; не использовать как строгую проверку готовности. Учётные данные Redis и кэшированные бизнес-данные не возвращаются.
      responses:
        "200":
          description: Диагностическое состояние кэша
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheStatus"
  /cmdbuild/custom-api/logging/status:
    get:
      x-flow-id: OAPI1
      tags: [diagnostics]
      summary: Диагностическая конфигурация логирования
      description: >
        Возвращает конфигурацию логирования без секретов. Проверяет только наличие
        cookie, без запроса sessions/current. Не является readiness.
      responses:
        "200":
          description: Диагностическое состояние логирования
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggingStatus"
        "401":
          description: Cookie CMDBuild-Authorization отсутствует
  /cmdbuild/custom-api/session:
    get:
      x-flow-id: OAPI2
      tags: [session]
      summary: Текущая сессия CMDBuild
      responses:
        "200":
          description: Отфильтрованная сессия и статус запроса в CMDBuild
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionProbeResponse"
        "401":
          description: Cookie CMDBuild-Authorization отсутствует
        "502":
          description: sessions/current вернул не-2xx, включая истёкшую сессию
  /cmdbuild/custom-api/model/catalog:
    get:
      x-flow-id: OAPI3
      tags: [model]
      summary: Каталог модели, доступный текущему пользователю
      responses:
        "200":
          description: Классы, атрибуты, домены и справочники, доступные текущему пользователю
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes:
    get:
      x-flow-id: OAPI4
      tags: [model]
      summary: Доступные классы CMDBuild
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Start"
      responses:
        "200":
          description: Список классов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /cmdbuild/custom-api/model/classes/{className}:
    get:
      x-flow-id: OAPI5
      tags: [model]
      summary: Метаданные одного класса CMDBuild
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Метаданные класса
        "403":
          description: Доступ запрещён
        "404":
          description: Класс не найден
  /cmdbuild/custom-api/model/classes/{className}/attributes:
    get:
      x-flow-id: OAPI6
      tags: [model]
      summary: Доступные атрибуты одного класса
      parameters:
        - $ref: "#/components/parameters/ClassName"
      responses:
        "200":
          description: Список атрибутов
  /cmdbuild/custom-api/model/domains:
    get:
      x-flow-id: OAPI7
      tags: [model]
      summary: Доступные домены CMDBuild
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Start"
        - name: detailed
          in: query
          schema:
            type: boolean
        - name: details
          in: query
          description: Дополнительно запросить метаданные отдельных доменов
          schema:
            type: boolean
            default: false
        - name: maxDetails
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
      responses:
        "200":
          description: Список доменов
  /cmdbuild/custom-api/auth/permission-scope:
    get:
      x-flow-id: OAPI8
      tags: [model]
      summary: Диагностика области действия разрешений
      responses:
        "200":
          description: Диагностические хэши доступной модели и статусы endpoints
  /cmdbuild/custom-api/csrf:
    get:
      x-flow-id: OAPI9
      tags: [session]
      summary: Получить CSRF-токен custom API
      responses:
        "200":
          description: CSRF-токен для вызовов, отличных от GET
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
  /cmdbuild/custom-api/schema:
    get:
      x-flow-id: OAPI10
      tags: [schema]
      summary: Готовность технической схемы
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
        - name: parent
          in: query
          schema:
            type: string
            example: Class
      responses:
        "200":
          description: Состояние технической схемы
  /cmdbuild/custom-api/schema/parents:
    get:
      x-flow-id: OAPI11
      tags: [schema]
      summary: Допустимые родительские суперклассы технической схемы
      responses:
        "200":
          description: Список родительских классов
  /cmdbuild/custom-api/schema/preview:
    post:
      x-flow-id: OAPI12
      tags: [schema]
      summary: Предварительный просмотр создания технической схемы без разрушительных изменений
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: План схемы без изменений в CMDBuild
        "403":
          description: Проверка CSRF не пройдена
  /cmdbuild/custom-api/schema/bootstrap:
    post:
      x-flow-id: OAPI13
      tags: [schema]
      summary: Создать отсутствующие объекты технической схемы без разрушительных изменений
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaBootstrapRequest"
      responses:
        "200":
          description: Первичное создание схемы завершено
        "403":
          description: Проверка CSRF или административных привилегий не пройдена
  /cmdbuild/custom-api/config:
    get:
      x-flow-id: OAPI14
      tags: [config]
      summary: Конфигурация выполнения
      responses:
        "200":
          description: Данные карточки конфигурации
    put:
      x-flow-id: OAPI15
      tags: [config]
      summary: Создать или обновить конфигурацию выполнения
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Конфигурация сохранена
  /cmdbuild/custom-api/assistant/object-flow/plan:
    post:
      x-flow-id: OAPI16
      tags: [assistant]
      summary: Предложить полный детерминированный Object Flow
      description: >
        LLM authoring-предложение полного потока Selection -> Match ->
        Selection. Ответ не меняет текущий spec и применяется явно через
        `/draft/object-flow/apply`. Нужны читаемый сохранённый шаблон и
        compare-and-swap base hash, но не update permission.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantObjectFlowPlanRequest"
      responses:
        "200":
          description: Типизированное предложение полного Object Flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantObjectFlowPlanResponse"
        "401":
          description: Сессия CMDBuild недействительна либо истекла
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Сохранённый шаблон изменился до формирования предложения
        "422":
          description: Предложение Assistant не прошло детерминированную проверку Object Flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantObjectFlowPlanResponse"
        "429":
          description: Достигнут лимит выполнения операций редактирования
        "503":
          description: Assistant выключен либо LiteLLM не настроен
  /cmdbuild/custom-api/assistant/object-flow/semantic-plan:
    post:
      x-flow-id: OAPI17
      tags: [assistant]
      summary: Подготовить или продолжить семантический план именованных блоков Object Flow
      description: >
        Двухэтапная операция редактирования. Этап context сохраняет ограниченную
        контрольную точку MCP в области текущей сессии и возвращает HTTP 202.
        Этап plan продолжает её и формирует по одному семантическому контракту
        на именованный пользовательский блок. Браузер передаёт ссылку на
        сохранённый шаблон и ограниченные изменения редактора, но не полный currentSpec.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantObjectFlowSemanticPlanRequest"
      responses:
        "200":
          description: Семантический план готов
        "202":
          description: Контрольная точка ограниченного контекста готова для этапа plan
        "400":
          description: Некорректный запрос, ссылка на шаблон либо изменения редактора
        "401":
          description: Сессия CMDBuild недействительна либо истекла
        "403":
          description: Проверка CSRF не пройдена либо сохранённый шаблон недоступен для чтения
        "409":
          description: Изменился сохранённый шаблон либо идентификационные данные контрольной точки
        "413":
          description: Ограниченный контекст либо контрольная точка превышает настроенные лимиты
        "422":
          description: Семантический план не прошёл детерминированную проверку
        "429":
          description: Достигнут лимит выполнения операций редактирования
        "502":
          description: Ошибка LiteLLM либо подготовки контекста MCP
        "503":
          description: Assistant выключен либо LiteLLM не настроен
        "504":
          description: Превышен таймаут этапа семантического плана; выполнение можно продолжить
  /cmdbuild/custom-api/draft/object-flow/apply:
    post:
      x-flow-id: OAPI18
      tags: [templates]
      summary: Применить проверенный Object Flow к черновику редактора
      description: >
        Детерминированно валидирует и компилирует проверенные selection/match
        stages в новый editor spec. Endpoint не вызывает LLM, не сохраняет и не
        публикует шаблон, не создаёт версию CMDB и не инвалидирует runtime/static
        cache. Нужны читаемый шаблон и совпадающий CAS base hash, но не update
        permission. Каждая selection и intermediate match stage возвращается как
        допустимый источник Diagram mapping.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectFlowApplyRequest"
      responses:
        "200":
          description: Проверенный spec редактора и список источников сопоставления
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectFlowApplyResponse"
        "401":
          description: Сессия CMDBuild недействительна либо истекла
        "403":
          description: Не пройдена CSRF-проверка или шаблон недоступен для чтения
        "409":
          description: Черновик редактора либо сохранённый шаблон изменился до применения
        "422":
          description: Проверяемый поток не прошёл детерминированную валидацию либо компиляцию
  /cmdbuild/custom-api/mcp:
    post:
      x-flow-id: OAPI19
      tags: [mcp]
      summary: Endpoint CMDBuild MCP JSON-RPC только для чтения
      description: >
        Адаптер Model Context Protocol для редактирования в текущей сессии
        CMDBuild. Предоставляет узкий разрешённый набор инструментов только для
        чтения, управляемый RuntimeConfigJson.assistant.mcp. Выполнение шаблонов,
        кэш endpoints и статические снимки не вызывают этот endpoint.
      security:
        - cmdbuildCookie: []
          csrfHeader: []
      parameters:
        - name: root
          in: query
          schema:
            type: string
            example: Cst_QueryTool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpJsonRpcRequest"
            examples:
              toolsList:
                summary: Перечислить разрешённые инструменты
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/list
              callModelSummary:
                summary: Прочитать сводку доступной модели CMDBuild
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/call
                  params:
                    name: cmdbuild_model_summary
                    arguments:
                      maxClasses: 30
                      maxDomains: 30
      responses:
        "200":
          description: Результат JSON-RPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "400":
          description: Ошибка протокола JSON-RPC либо инструмента
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpJsonRpcResponse"
        "403":
          description: Проверка CSRF либо same-origin не пройдена
  /cmdbuild/custom-api/templates:
    get:
      x-flow-id: OAPI20
      tags: [templates]
      summary: Перечислить шаблоны запросов
      responses:
        "200":
          description: Список шаблонов
          content:
            application/json:

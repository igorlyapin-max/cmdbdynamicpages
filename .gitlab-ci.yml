stages:
  - test
  - container

npm_test:
  stage: test
  image: node:20
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - npm run ci

container_image:
  stage: container
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - docker run --rm -v "$PWD:/work" -w /work node:20 node scripts/validate-container-delivery.mjs
    - docker compose --env-file .env.example -f docker-compose.runtime.yml config >/dev/null
    - docker compose -f docker-compose.nginx.yml config >/dev/null
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

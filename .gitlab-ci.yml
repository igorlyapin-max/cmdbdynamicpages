stages:
  - test
  - container

npm_test:
  stage: test
  image: node:20@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm run ci
  artifacts:
    name: "cmdbdynamicpages-custompage-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/cmdbdynamicpages-custompage.zip
    expire_in: 30 days

ui_smoke_required:
  stage: test
  image: node:20-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm install --no-save --no-package-lock playwright@1.61.1
    - npx playwright install --with-deps chromium
    - npm run test:ui:required

go_vulncheck:
  stage: test
  image: golang:1.25.11-alpine@sha256:523c3effe300580ed375e43f43b1c9b091b68e935a7c3a92bfcc4e7ed55b18c2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - go test ./cmd/cmdp-d2-import
    - go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./cmd/cmdp-d2-import

container_image:
  stage: container
  image: docker:27-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  services:
    - name: docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache bash git nodejs npm openssl
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - npm run container:check
    - docker compose --env-file .env.example -f docker-compose.runtime.yml config >/dev/null
    - bash scripts/nginx-test.sh
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export APP_VERSION="${APP_VERSION:-00.00.00.00}"
    - if [ -f VERSION ]; then export APP_VERSION="$(tr -d '\r\n' < VERSION)"; fi
    - test -z "$(git status --porcelain --untracked-files=all)"
    - test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
    - if [ -n "$CI_COMMIT_TAG" ]; then test "$CI_COMMIT_TAG" = "v$APP_VERSION"; fi
    - export MANUAL_IMAGE="$CI_REGISTRY_IMAGE:manual-$IMAGE_TAG"
    - docker build -t "$MANUAL_IMAGE" .
    - docker run --rm --entrypoint node "$MANUAL_IMAGE" scripts/build-identity.mjs verify-runtime --root /app --expect-provenance unverified-local
    - node scripts/container-image.mjs build --tag "$CI_REGISTRY_IMAGE:$IMAGE_TAG" --require-clean
    - node scripts/container-image.mjs verify --image "$CI_REGISTRY_IMAGE:$IMAGE_TAG" --require-clean
    - export GKM_NODE_BASE_IMAGE="cmdbdynamicpages-gkm-node:$IMAGE_TAG"
    - export GKM_GO_BASE_IMAGE="cmdbdynamicpages-gkm-go:$IMAGE_TAG"
    - docker build -f tests/fixtures/gkm-node-base.Dockerfile -t "$GKM_NODE_BASE_IMAGE-fixture" .
    - docker build -f tests/fixtures/gkm-go-base.Dockerfile -t "$GKM_GO_BASE_IMAGE-fixture" .
    - export GKM_FIXTURE_DIR="$(mktemp -d)"
    - trap 'rm -rf "$GKM_FIXTURE_DIR"' EXIT
    - mkdir -p "$GKM_FIXTURE_DIR/ca"
    - openssl req -x509 -newkey rsa:2048 -nodes -keyout "$GKM_FIXTURE_DIR/fixture-key.pem" -out "$GKM_FIXTURE_DIR/ca/fixture-ca.crt" -days 1 -subj '/CN=cmdbdynamicpages-ci-fixture'
    - export GKM_NODE_BASE="$(sed -n 's/^ARG GKM_NODE_BASE_IMAGE=//p' Dockerfile)"
    - test -n "$GKM_NODE_BASE"
    - docker run --rm "$GKM_NODE_BASE" cat /etc/apk/repositories > "$GKM_FIXTURE_DIR/apk-repositories"
    - scripts/build-gkm-base-images.sh --node-tag "$GKM_NODE_BASE_IMAGE" --go-tag "$GKM_GO_BASE_IMAGE" --ca-dir "$GKM_FIXTURE_DIR/ca" --apk-repositories "$GKM_FIXTURE_DIR/apk-repositories"
    - docker run --rm --entrypoint sh "$GKM_NODE_BASE_IMAGE" -ec 'test -s /etc/apk/repositories && test -f /usr/local/share/ca-certificates/fixture-ca.crt'
    - docker run --rm --entrypoint sh "$GKM_GO_BASE_IMAGE" -ec 'test -s /etc/apk/repositories && test -f /usr/local/share/ca-certificates/fixture-ca.crt'
    - export GKM_MANUAL_IMAGE="$CI_REGISTRY_IMAGE:gkm-manual-$IMAGE_TAG"
    - docker build --target gkm-runtime --build-arg "GKM_NODE_BASE_IMAGE=$GKM_NODE_BASE_IMAGE" --build-arg "GKM_GO_BASE_IMAGE=$GKM_GO_BASE_IMAGE" -t "$GKM_MANUAL_IMAGE" .
    - docker run --rm --entrypoint node "$GKM_MANUAL_IMAGE" scripts/build-identity.mjs verify-runtime --root /app --expect-provenance unverified-local
    - node scripts/container-image.mjs build --target gkm-runtime-canonical --node-base-image "$GKM_NODE_BASE_IMAGE" --go-base-image "$GKM_GO_BASE_IMAGE" --tag "$CI_REGISTRY_IMAGE:gkm-$IMAGE_TAG" --require-clean
    - node scripts/container-image.mjs verify --image "$CI_REGISTRY_IMAGE:gkm-$IMAGE_TAG" --require-clean
    - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:gkm-$IMAGE_TAG"
